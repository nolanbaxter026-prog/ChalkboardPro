<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChalkboardPro</title>
<style>
:root{
  --bg:#e9eee9; --panel:#ffffff; --ink:#16241d; --muted:#5d6e64; --line:#cfd8d1;
  --accent:#1d5a40; --accent-ink:#ffffff; --board:#274d3d; --chalk:#f6f4ec; --warn:#a5372a; --yellow:#f2c94c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --panel:#19221d; --ink:#e9efe9; --muted:#97a89d; --line:#2b3830;
    --accent:#58bd8c; --accent-ink:#0b120e; --board:#1d3a2d; --warn:#ee8472;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --panel:#19221d; --ink:#e9efe9; --muted:#97a89d; --line:#2b3830;
  --accent:#58bd8c; --accent-ink:#0b120e; --board:#1d3a2d; --warn:#ee8472;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font:700 21px/1 Rockwell,"Roboto Slab","Courier New",Georgia,serif}
header span{color:var(--muted);font-size:13px}
main{flex:1;overflow:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}
nav button{border:0;background:none;color:var(--muted);padding:9px 2px 8px;font:600 12px/1.2 system-ui,sans-serif;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:1px}
nav button[aria-current="true"]{color:var(--accent)}
h2{font:700 18px/1.2 Rockwell,"Roboto Slab",Georgia,serif;margin:4px 0 10px}
h3{font:700 15px/1.2 Rockwell,"Roboto Slab",Georgia,serif;margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.board{position:relative;background:transparent;border:0;padding:0;margin:0}
.top{position:absolute;top:8px;left:8px;right:8px;z-index:2;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.fbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.fbar>*{pointer-events:auto;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.fbar .btn.sm{padding:6px 8px;font-size:12px}
.fbar .seg button{padding:6px 9px;font-size:12px}
.rmenu{position:absolute;z-index:3;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13px}
.rmenu[hidden]{display:none}
.rmenu .chip{padding:5px 9px;font-size:12px}
.rmenu select{padding:6px}
main.design{padding:0 0 24px}
.hint{align-self:flex-start;background:rgba(22,36,29,.82);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px}
.warn{align-self:flex-start;background:#7a2a1d;color:#fff;font-size:12px;padding:6px 8px;border-radius:6px}
#field{width:100%;height:70vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.bar,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.card .row:last-child{margin-bottom:0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:8px;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);padding:8px 11px;font:600 13px/1 system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label:first-child{margin-top:0}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0}
label.chk input{width:auto}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
input[type=color]{padding:2px;height:36px;min-width:44px}
input[type=range]{padding:0;border:0;background:none}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:99px;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--yellow)}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:12px;font:700 15px/1.2 Rockwell,"Roboto Slab",Georgia,serif;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted)}
details.card[open]>summary::after{content:"▴"}
details.card>.body{padding:0 12px 12px}
.dright{padding:12px 12px 0}
.dgrid{display:block}
@media(min-width:900px){.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;align-items:start}.dleft{position:sticky;top:0}.dright{padding:12px 12px 0 0}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.play{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.play svg{display:block;width:100%;height:auto;cursor:pointer}
.play .meta{padding:8px 9px 4px}
.play .meta b{display:block;font-size:14px;line-height:1.2}
.play .meta small,.note{color:var(--muted);font-size:13px}
.play .acts{display:flex;gap:4px;padding:4px 7px 8px;flex-wrap:wrap}
.fold{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.fold b{display:block;font-size:15px}
.fold small{color:var(--muted)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:13px}
.crumb button{border:0;background:none;color:var(--accent);font:600 13px system-ui,sans-serif;padding:2px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:1px dashed var(--line);border-radius:10px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.item svg{width:52px;height:auto;border-radius:4px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted)}
.item .n{width:22px;text-align:center;color:var(--muted);font-weight:700}
.lib{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 9px;border-radius:7px;margin-bottom:4px;font:14px system-ui,sans-serif;cursor:pointer}
#libList{max-height:190px;overflow:auto;margin-top:6px}
.rrow{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px}
.link{background:none;border:0;color:var(--accent);font:600 14px system-ui,sans-serif;padding:4px 0;cursor:pointer;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:12px;padding:14px;width:100%;max-width:460px;max-height:86vh;overflow:auto}
.modal textarea{min-height:130px;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;max-width:90%}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>ChalkboardPro</h1><span>Free football playbook</span></header>
<main id="main"></main>
<nav id="tabs">
  <button data-act="tab" data-id="design"><b>✏️</b>Designer</button>
  <button data-act="tab" data-id="book"><b>📋</b>Playbook</button>

  <button data-act="tab" data-id="settings"><b>⚙️</b>Settings</button>
</nav>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = n => Math.round(n * 10) / 10;
const PX = 6.75, LOS = 299, LINE = 308;
let VB = {x0:0, y0:0, x1:360, y1:480};
const cx = v => Math.max(VB.x0 + 14, Math.min(VB.x1 - 14, v));
const cy = v => Math.max(VB.y0 + 14, Math.min(VB.y1 - 14, v));
function lum(h){ h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); if (isNaN(n)) return .5; return (.299 * (n >> 16 & 255) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; }

/* ---------- routes (yards: [toward sideline, upfield] from the player's start) ---------- */
const ROUTES = [
['go','Go / Fly / Streak',20,D=>[[0,D]],'Vertical release, straight upfield.'],
['fade','Fade',20,D=>[[1,D*.5],[3,D]],'Vertical, bending toward the sideline.'],
['slant','Slant',5,D=>[[0,1.5],[-(D-1.5),D]],'1-3 steps up, then a 45 degree cut inside.'],
['hitch','Hitch / Stop',6,D=>[[0,D],[0,D-1.5]],'Stem up, stop and turn to the QB.'],
['curl','Curl',12,D=>[[0,D],[-1.5,D-2.5]],'Stem, then curl back inside.'],
['comeback','Comeback',14,D=>[[0,D],[2,D-3.5]],'Stem deep, return toward the sideline.'],
['out','Out',10,D=>[[0,D],[12,D]],'Stem, then a flat cut to the sideline.'],
['dig','Dig / In',12,D=>[[0,D],[-15,D]],'Stem, then a flat cut across the middle.'],
['post','Post',12,D=>[[0,D],[-10,D+10]],'Stem, then 45 degrees to the goal post.'],
['corner','Corner / Flag',12,D=>[[0,D],[10,D+10]],'Stem, then 45 degrees to the pylon.'],
['postcorner','Post-Corner',10,D=>[[0,D],[-3,D+3],[5,D+14]],'Fake post, break to the corner.'],
['cornerpost','Corner-Post',8,D=>[[0,D],[4,D+4],[-2,D+16]],'Fake corner, break to the post.'],
['outup','Out-and-Up',8,D=>[[0,D],[3,D],[3,D+16]],'Sell the out, then go vertical.'],
['sluggo','Slant-and-Go / Sluggo',20,D=>[[0,1.5],[-3,4.5],[-3,D]],'Sell the slant, then go vertical.'],
['hitchgo','Hitch-and-Go',20,D=>[[0,6],[0,4],[1,D]],'Sell the hitch, then go vertical.'],
['seam','Seam',20,D=>[[-1,D]],'Vertical up the hash, splitting the safeties.'],
['drag','Drag / Shallow Cross',2.5,D=>[[0,2],[-18,D]],'Shallow crosser at 2-4 yards.'],
['over','Over / Deep Cross',15,D=>[[-3,5],[-22,D]],'Deep crosser behind the linebackers.'],
['whip','Whip / Pivot',3,D=>[[0,D],[-1,D+.5],[5,D-.5]],'Sell inside, pivot back out.'],
['stick','Stick',6,D=>[[0,D],[-2,D-.5]],'Stem to 6 yards, sit down inside.'],
['sail','Sail',12,D=>[[0,D],[8,D+3]],'Out-breaking deep route.'],
['flat','Flat',1,D=>[[7,D]],'Release to the flat, 1-3 yards.'],
['swing','Swing',0,D=>[[3,-1.5],[9,0]],'RB arcs outside behind the line.'],
['wheel','Wheel',25,D=>[[4,-.5],[9,2],[10,12],[10,D]],'RB or slot swings out, then up the sideline.'],
['angle','Angle',4,D=>[[1,D],[-2,D+2],[3,D+6]],'RB sells a block, cuts inside and back out.'],
['texas','Texas',5,D=>[[4,.5],[-1,D]],'RB to the flat, breaks back inside at 5-6.'],
['screen','Screen',0,D=>[[3,-1.5],[6,-1.5]],'Behind the line while linemen block ahead.'],
['check','Check-Release',2,D=>[[0,-.5],[5,.5]],'RB checks a rusher, then releases to the flat.'],
['block','Pass Block',0,D=>[[0,.8]],'Short set / block.']
];
const RT = {}; ROUTES.forEach(r => RT[r[0]] = r);

/* ---------- formations, fronts, coverage ---------- */
const OLX = [140,160,180,200,220];
const FORMS = {
  'I-Form':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,328],['FB',180,352],['RB',180,376],['TE',240,LINE],['X',30,LINE],['Z',330,322]],
  'Spread 2x2':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,350],['RB',202,350],['X',30,LINE],['H',100,322],['S',260,322],['Z',330,LINE]],
  'Trips Right':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,350],['RB',156,350],['X',30,LINE],['H',250,322],['S',290,322],['Z',330,LINE]],
  'Pro Set':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,328],['RB',148,364],['FB',212,364],['TE',240,LINE],['X',30,LINE],['Z',330,322]]
};
const PERS = [10,11,12,13,21,22];
const roleOf = l => /^(LT|LG|C|RG|RT|OL)$/.test(l) ? 'OL' : l === 'QB' ? 'QB' : /^(RB|FB)$/.test(l) ? 'RB' : /^(TE|Y)$/.test(l) ? 'TE' : 'WR';
const roleColor = r => r === 'OL' ? '#e9e6dc' : r === 'QB' ? '#f2c94c' : r === 'RB' ? '#f2994a' : r === 'TE' ? '#6fcf97' : '#56ccf2';
const mk = (l, x, y, role) => ({id:uid(), label:l, role:role || roleOf(l), x:x, y:y, route:null});
const dmk = (l, x, y) => ({id:uid(), label:l, x:x, y:y, zone:'none', zoneColor:'', isBlitz:false, gap:'A-Gap'});
function buildForm(name){ return FORMS[name].map(a => mk(a[0], a[1], a[2])); }
function pers(n){
  const rb = Math.floor(n / 10), te = n % 10, wr = 5 - rb - te, o = [];
  OLX.forEach((x, i) => o.push(mk(['LT','LG','C','RG','RT'][i], x, LINE)));
  o.push(mk('QB', 180, 345));
  [['RB',158,350],['FB',202,350]].slice(0, rb).forEach(a => o.push(mk(a[0], a[1], a[2])));
  [['Y',240,LINE],['F',120,LINE],['H',262,324]].slice(0, te).forEach(a => o.push(mk(a[0], a[1], a[2], 'TE')));
  [['X',30,LINE],['Z',330,324],['S',280,324],['S',90,324]].slice(0, wr).forEach(a => o.push(mk(a[0], a[1], a[2], 'WR')));
  return o;
}
const FRONTS = {
  '4-3':[['DE',130,288],['DT',165,288],['DT',195,288],['DE',230,288],['W',120,262],['M',180,258],['S',240,262],['CB',30,280],['CB',330,280],['FS',140,215],['SS',220,215]],
  '3-4':[['DE',148,288],['NT',180,288],['DE',212,288],['OLB',115,284],['ILB',160,262],['ILB',200,262],['OLB',245,284],['CB',30,280],['CB',330,280],['FS',145,215],['SS',215,215]],
  '4-2-5':[['DE',130,288],['DT',165,288],['DT',195,288],['DE',230,288],['LB',160,262],['LB',200,262],['NB',92,272],['CB',30,280],['CB',330,280],['FS',145,212],['SS',215,212]],
  '5-3':[['DE',120,288],['DT',150,288],['NT',180,288],['DT',210,288],['DE',240,288],['W',125,262],['M',180,256],['S',235,262],['CB',30,280],['CB',330,280],['FS',180,214]]
};
const ZONE_COL = {'none':'#868e96','Deep 1/3':'#4c6ef5','Deep 1/2':'#4c6ef5','Deep 1/4':'#4c6ef5','Hook/Curl':'#2f9e44','Curl/Flat':'#9333ea','Flat':'#38bdf8','Seam/Hole':'#a855f7','Spy':'#f97316'};
const ZONES = Object.keys(ZONE_COL);
const COVS = ['Cover 0','Cover 1','Cover 2','Cover 3','Cover 4'];
const GAPS = ['A-Gap','B-Gap','C-Gap','Edge'];
function applyCov(def, cov){
  const LB = ['W','M','S','LB','OLB','ILB'];
  def.forEach(d => {
    if (d.isBlitz) return;
    const l = d.label; let z = 'none';
    if (cov === 'Cover 2'){ if (l === 'CB' || l === 'NB') z = 'Flat'; else if (l === 'FS' || l === 'SS') z = 'Deep 1/2'; else if (LB.indexOf(l) > -1) z = 'Hook/Curl'; }
    else if (cov === 'Cover 3'){ if (l === 'CB' || l === 'FS') z = 'Deep 1/3'; else if (l === 'SS' || l === 'NB') z = 'Flat'; else if (LB.indexOf(l) > -1) z = 'Hook/Curl'; }
    else if (cov === 'Cover 4'){ if (l === 'CB' || l === 'FS' || l === 'SS') z = 'Deep 1/4'; else if (l === 'NB') z = 'Flat'; else if (LB.indexOf(l) > -1) z = 'Hook/Curl'; }
    else if (cov === 'Cover 1'){ if (l === 'FS') z = 'Deep 1/3'; else if (l === 'M') z = 'Spy'; }
    d.zone = z; d.zoneColor = ZONE_COL[z];
  });
}
function buildFront(key, cov){ const d = FRONTS[key].map(a => dmk(a[0], a[1], a[2])); applyCov(d, cov); return d; }
const SIT = {'1st & 10':[20,10],'Backed Up':[5,10],'2nd & Short':[35,2],'2nd & Long':[30,9],'3rd & Medium':[45,5],'3rd & Long':[40,9],'4th & Short':[55,1],'Red Zone':[80,10],'Goal Line':[97,3],'2-Minute Drill':[40,10]};

/* ---------- special teams modules ---------- */
const rowU = (ls, xs, y) => ls.map((l, i) => [l, xs[i], y]);
const U = {
  ko:()=>rowU(['L1','L2','L3','L4','L5'],[.08,.16,.24,.32,.40],.58).concat(rowU(['R5','R4','R3','R2','R1'],[.60,.68,.76,.84,.92],.58),[['K',.5,.63]]),
  kr:()=>rowU(['LT','LG','C','RG','RT'],[.38,.44,.5,.56,.62],.46).concat(rowU(['LU','RU'],[.36,.64],.38),rowU(['LB','RB'],[.28,.72],.31),rowU(['LKR','RKR'],[.40,.60],.14)),
  fk:()=>rowU(['LE','LT','LG','C','RG','RT','RE'],[.41,.44,.47,.5,.53,.56,.59],.58).concat(rowU(['LW','RW'],[.35,.65],.60),[['H',.5,.65],['K',.45,.66]]),
  fb:()=>rowU(['D1','D2','D3','D4','D5','D6','D7'],[.32,.40,.46,.5,.54,.60,.68],.555).concat(rowU(['C1','C2'],[.20,.80],.55),[['S',.5,.40],['KR',.5,.18]]),
  pt:()=>rowU(['LE','LT','LG','C','RG','RT','RE'],[.41,.44,.47,.5,.53,.56,.59],.58).concat(rowU(['GL','GR'],[.09,.91],.58),[['PP',.5,.64],['P',.5,.73]]),
  pr:()=>rowU(['D1','D2','D3','D4','D5','D6'],[.32,.40,.46,.54,.60,.68],.555).concat(rowU(['J1','J2'],[.10,.90],.54),rowU(['UB1','UB2'],[.40,.60],.32),[['PR',.5,.14]])
};
const STM = {
  'Kickoff':{folder:'Kickoff',name:'Kickoff Coverage',a:'ko',b:'kr',spot:35},
  'Kick Return':{folder:'Kick Return',name:'Kick Return',a:'kr',b:'ko',spot:35},
  'Punt':{folder:'Punt',name:'Punt Protection',a:'pt',b:'pr',spot:35},
  'Punt Return':{folder:'Punt Return',name:'Punt Return',a:'pr',b:'pt',spot:35},

function svgPt(svg, e){ const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x, y:q.y}; }
function pick(p){
  const k = (db.settings.icon || 100) / 100, R = Math.max(14, 20 * k); let best = null, bd = R;
  ed.players.forEach(q => { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = {side:'o', obj:q}; } });
  ed.defense.forEach(q => { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd){ bd = d; best = {side:'d', obj:q}; } });
  return best;
}
function segDist(p, a, b){ const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy; if (!l) return Math.hypot(p.x - a.x, p.y - a.y); let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy)); }
function eraseAt(p){
  let best = null, bd = 14;
  ed.lines.forEach((l, i) => { for (let j = 1; j < l.pts.length; j++){ const d = segDist(p, l.pts[j-1], l.pts[j]); if (d < bd){ bd = d; best = {k:'line', i:i}; } } });
  ed.players.forEach(pl => { if (pl.route && pl.route.pts.length){ const pts = [{x:pl.x, y:pl.y}].concat(pl.route.pts); for (let j = 1; j < pts.length; j++){ const d = segDist(p, pts[j-1], pts[j]); if (d < bd){ bd = d; best = {k:'route', pl:pl}; } } } });
  if (!best) return;
  pushHist();
  if (best.k === 'line') ed.lines.splice(best.i, 1); else best.pl.route = null;
  renderInspector(); syncEditor();
}

function rmOp(op){
  const q = rmPlayer(); if (!q) return; const ix = ed.rm.idx; ed.sel = {side:'o', id:q.id};
  if (op === 'delPt'){ if (!q.route || ix == null) return; pushHist(); q.route.pts.splice(ix, 1); if (!q.route.pts.length) q.route = null; renderInspector(); syncEditor(); if (q.route) openRouteMenu(q, Math.min(ix, q.route.pts.length - 1)); else hideRouteMenu(); return; }
  if (op === 'addPt'){ if (!q.route || ix == null) return; pushHist(); const prev = ix === 0 ? {x:q.x, y:q.y} : q.route.pts[ix - 1], cur = q.route.pts[ix]; q.route.pts.splice(ix, 0, {x:(prev.x + cur.x) / 2, y:(prev.y + cur.y) / 2}); renderInspector(); syncEditor(); openRouteMenu(q, ix); return; }
  routeOp(op);
  if (op === 'clear' || !q.route) hideRouteMenu(); else openRouteMenu(q, q.route.pts.length - 1);
}
function bindField(){
  const svg = $('#field');
  svg.addEventListener('pointerdown', e => {
    if (ed.playing){ ed.playing = false; updPlayBtn(); }
    hideRouteMenu();
    const p = svgPt(svg, e);
    const cap = () => { try{ svg.setPointerCapture(e.pointerId); }catch(_){} };
    if (ed.mode === 'move'){
      const so = selObj();
      if (ed.sel && ed.sel.side === 'o' && so && so.route){
        const i = so.route.pts.findIndex(q => Math.hypot(q.x - p.x, q.y - p.y) <= 13);
        if (i > -1){ ed.drag = {kind:'node', obj:so, idx:i, moved:false}; cap(); return; }
      }
      const hit = pick(p);
      if (hit){ select(hit.side, hit.obj.id); ed.drag = {kind:'player', side:hit.side, obj:hit.obj, ox:p.x - hit.obj.x, oy:p.y - hit.obj.y, moved:false}; cap(); return; }
      for (const pl of ed.players){
        const r = pl.route;
        if (r && r.pts.length){ const q = r.pts[r.pts.length - 1]; if (Math.hypot(q.x - p.x, q.y - p.y) <= 13){ select('o', pl.id); ed.drag = {kind:'node', obj:pl, idx:r.pts.length - 1, moved:false}; cap(); return; } }
      }
      deselect();
      return;
    }
    const t = ed.tool;
    if (t === 'route'){
      const hit = pick(p);
      if (hit) select(hit.side, hit.obj.id);
      else { const so = selObj(); if (ed.sel && ed.sel.side === 'o' && so){ pushHist(); ensureRoute(so).pts.push({x:Math.round(p.x), y:Math.round(p.y)}); renderInspector(); syncEditor(); } else toast('Tap a player first'); }
    } else if (t === 'erase'){ eraseAt(p); }
    else if (t === 'straight'){
      const now = Date.now();
      if (ed.straight && ed.lastTap && now - ed.lastTap.t < 400 && Math.hypot(p.x - ed.lastTap.x, p.y - ed.lastTap.y) < 20){ finishStraight(); return; }
      if (!ed.straight){ pushHist(); ed.straight = [p]; } else ed.straight.push(p);
      ed.lastTap = {x:p.x, y:p.y, t:now}; syncEditor();
    } else {
      pushHist();
      ed.tmp = {type:t, pts:(t === 'free' || t === 'curve') ? [p] : [p, p], color:ed.pen, end:endFor(t), dash:ed.dash};
      cap();
    }
  });
  svg.addEventListener('pointermove', e => {
    const p = svgPt(svg, e);
    if (ed.drag){
      const d = ed.drag;
      if (d.kind === 'node'){ if (!d.moved){ pushHist(); d.moved = true; } d.obj.route.pts[d.idx] = {x:cx(p.x), y:cy(p.y)}; }
      else {
        let nx = cx(p.x - d.ox), ny = cy(p.y - d.oy);
        if (db.settings.snap && Math.abs(ny - LINE) < 7) ny = LINE;
        const dx = nx - d.obj.x, dy = ny - d.obj.y;
        if (!d.moved){ if (Math.hypot(dx, dy) < 2) return; pushHist(); d.moved = true; }
        d.obj.x = nx; d.obj.y = ny;
        if (d.obj.route) d.obj.route.pts.forEach(q => { q.x += dx; q.y += dy; });
      }
      draw();
    } else if (ed.tmp){
      const t = ed.tmp;
      if (t.type === 'free' || t.type === 'curve'){ const l = t.pts[t.pts.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) > 2) t.pts.push(p); }
      else t.pts = [t.pts[0], p];
      draw();
    }
  });
  const up = () => {
    if (ed.drag){ const d = ed.drag, m = d.moved; ed.drag = null; if (m){ touch(); syncEditor(); const w = $('#warn'); if (w) w.hidden = !legalWarn(); } else if (d.kind === 'node') openRouteMenu(d.obj, d.idx); else if (d.kind === 'player' && d.side === 'o') openRouteMenu(d.obj, null); else if (d.kind === 'player' && d.side === 'd') openDefMenu(d.obj); }
    if (ed.tmp){
      const t = ed.tmp; ed.tmp = null; let len = 0;
      for (let i = 1; i < t.pts.length; i++) len += Math.hypot(t.pts[i].x - t.pts[i-1].x, t.pts[i].y - t.pts[i-1].y);
      if (len > 6){ ed.lines.push({type:t.type, pts:t.pts.map(q => ({x:r1(q.x), y:r1(q.y)})), color:t.color, end:t.end, dash:t.dash}); touch(); }
      draw();
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', () => { ed.drag = null; ed.tmp = null; draw(); });
}

/* ---------- playback ---------- */
let raf = null, lastT = 0;
function updPlayBtn(){ const b = $('#playBtn'); if (b) b.textContent = ed.playing ? '⏸ Pause' : '▶ Play'; }
function tick(now){
  if (!ed.playing){ raf = null; return; }
  const dt = (now - lastT) / 1000; lastT = now;
  ed.t = Math.min(1, ed.t + dt * .25 * ed.speed); if (ed.t >= 1) ed.playing = false;
  const sc = $('#scrub'); if (sc) sc.value = ed.t * 100;
  const tl = $('#tlab'); if (tl) tl.textContent = (ed.t * 4).toFixed(1) + 's';
  draw(); updPlayBtn();
  raf = requestAnimationFrame(tick);
}
function startPlay(){ if (ed.t >= 1) ed.t = 0; ed.playing = true; lastT = performance.now(); if (!raf) raf = requestAnimationFrame(tick); updPlayBtn(); }

/* ---------- editing operations ---------- */
function freeSpot(list, bx, by){
  const free = (x, y) => !list.some(p => Math.hypot(p.x - x, p.y - y) < 22);
  if (free(bx, by)) return {x:bx, y:by};
  for (let r = 1; r <= 12; r++) for (let i = 0; i < 8; i++){ const a = i / 8 * Math.PI * 2, x = cx(bx + Math.cos(a) * r * 22), y = cy(by + Math.sin(a) * r * 22); if (free(x, y)) return {x:x, y:y}; }
  return {x:bx, y:by};
}
function spawn(key){
  const side = key[0], lab0 = key.slice(2); pushHist();
  if (side === 'o'){ const lab = lab0 === '*' ? db.settings.off.name : lab0, sp = freeSpot(ed.players, 180, 335), p = mk(lab, sp.x, sp.y, roleOf(lab)); ed.players.push(p); select('o', p.id); }
  else { const lab = lab0 === '*' ? db.settings.def.name : lab0, sp = freeSpot(ed.defense, 180, 268), d = dmk(lab, sp.x, sp.y); applyCov([d], ed.cov); ed.defense.push(d); select('d', d.id); }
}
const hashHalf = l => l === 'nfl' ? 13 : l === 'college' ? 36 : 61;
const hashOff = (l, h) => h === 'left' ? -hashHalf(l) : h === 'right' ? hashHalf(l) : 0;
function shiftAll(d){
  const sh = o => { o.x = cx(o.x + d); if (o.route) o.route.pts.forEach(q => { q.x += d; }); };
  ed.players.forEach(sh); ed.defense.forEach(sh); ed.lines.forEach(l => l.pts.forEach(q => { q.x += d; }));
}
function setHash(h){
  const d = hashOff(db.settings.level, h) - hashOff(db.settings.level, ed.hash);
  if (d){ pushHist(); shiftAll(d); }
  ed.hash = h; syncEditor();
}
function setLevel(l){
  const S = db.settings, d = hashOff(l, ed.hash) - hashOff(S.level, ed.hash);
  if (d){ pushHist(); shiftAll(d); }
  S.level = l; save(); const sl = $('#sLevel'); if (sl) sl.value = l; syncEditor();
}
function flipPlay(){
  pushHist(); const f = o => { o.x = 360 - o.x; if (o.route) o.route.pts.forEach(q => { q.x = 360 - q.x; }); };
  ed.players.forEach(f); ed.defense.forEach(f); ed.lines.forEach(l => l.pts.forEach(q => { q.x = 360 - q.x; }));
  ed.hash = ed.hash === 'left' ? 'right' : ed.hash === 'right' ? 'left' : 'middle'; if ($('#sHash')) $('#sHash').value = ed.hash;
  renderInspector(); syncEditor();
}
function setFront(key){
  pushHist(); ed.front = key; ed.defense = key === 'none' ? [] : buildFront(key, ed.cov); ed.sel = null; renderInspector(); syncEditor();
}
function routeOp(op){
  const p = selObj(); if (!p || !p.route || !p.route.pts.length) return;
  pushHist(); const pts = p.route.pts, st = {x:p.x, y:p.y};
  if (op === 'straight'){ if (pts.length > 1) p.route.pts = [pts[pts.length - 1]]; }
  else if (op === 'bigger' || op === 'smaller'){ const f = op === 'bigger' ? 1.25 : .8; p.route.pts = pts.map(q => ({x:st.x + (q.x - st.x) * f, y:st.y + (q.y - st.y) * f})); }
  else if (op === 'flip') p.route.pts = pts.map(q => ({x:st.x - (q.x - st.x), y:q.y}));
  else if (op === 'undo'){ pts.pop(); if (!pts.length) p.route = null; }
  else if (op === 'clear') p.route = null;
  else if (op === 'curve'){
    let a = [st].concat(pts);
    if (a.length === 2){ const dx = a[1].x - a[0].x, dy = a[1].y - a[0].y; a = [a[0], {x:(a[0].x + a[1].x) / 2 - dy * .18, y:(a[0].y + a[1].y) / 2 + dx * .18}, a[1]]; }
    const g = i => a[Math.max(0, Math.min(a.length - 1, i))], out = [];
    const f = (a0, a1, a2, a3, t) => .5 * (2 * a1 + (-a0 + a2) * t + (2 * a0 - 5 * a1 + 4 * a2 - a3) * t * t + (-a0 + 3 * a1 - 3 * a2 + a3) * t * t * t);
    for (let i = 0; i < a.length - 1; i++) for (let k = 0; k < 6; k++){ if (i === 0 && k === 0) continue; const t = k / 6, p0 = g(i-1), p1 = g(i), p2 = g(i+1), p3 = g(i+2); out.push({x:f(p0.x, p1.x, p2.x, p3.x, t), y:f(p0.y, p1.y, p2.y, p3.y, t)}); }
    out.push({x:a[a.length-1].x, y:a[a.length-1].y}); p.route.pts = out;
  }
  renderInspector(); syncEditor();
}
async function saveRoute(){

  const s = p.x > 180 ? 1 : -1;
  db.routes.push({id:uid(), name:r.name.trim(), end:p.route.end, dash:p.route.dash, pts:p.route.pts.map(q => ({o:(q.x - p.x) * s, u:p.y - q.y}))});

}

function makeST(key){

function openModal(html){ const b = $('#modalBox'); b.innerHTML = html; b.onclick = null; $('#modal').classList.add('on'); }

function ask(title, fields, okLabel){

      ? '<label>' + esc(f.label) + '</label><select data-f="' + f.id + '">' + f.options + '</select>'

      '<div class="row" style="margin-top:12px"><button class="btn primary" data-m="ok">' + (okLabel || 'Save') + '</button><button class="btn" data-m="x">Cancel</button></div>';

function copyText(txt, el){

}
const enc = o => 'CBP2:' + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function dec(s){ s = s.trim(); if (/^CBP[12]:/.test(s)) s = decodeURIComponent(escape(atob(s.slice(5)))); return JSON.parse(s); }
function doImport(txt){
  let o; try{ o = dec(txt); }catch(e){ toast('That code is not valid'); return; }
  let np = 0, nl = 0;
  const addPlay = pl => { if (!pl || !Array.isArray(pl.players) || db.plays.some(x => x.id === pl.id)) return; db.plays.push(normPlay(pl)); np++; };
  if (o.t === 'play') addPlay(o.play);
  else if (o.t === 'plan' || o.t === 'all'){
    (o.plays || []).forEach(addPlay);
    (o.t === 'plan' ? [o.plan] : (o.plans || [])).forEach(pn => { if (!pn || !Array.isArray(pn.items)) return; if (db.plans.some(x => x.id === pn.id)) pn.id = uid(); db.plans.push(pn); nl++; });
    (o.folders || []).forEach(f => { if (f && f.name && !db.folders.some(x => x.name === f.name)) db.folders.push({name:f.name, parent:f.parent || null}); });
    (o.routes || []).forEach(r => { if (r && r.id && !db.routes.some(x => x.id === r.id)) db.routes.push(r); });
    (o.formations || []).forEach(f => { if (f && f.id && !db.formations.some(x => x.id === f.id)) db.formations.push(f); });
  } else { toast('That code is not valid'); return; }
  db = normDb(db); save(); toast('Imported ' + np + ' play' + (np === 1 ? '' : 's') + ', ' + nl + ' plan' + (nl === 1 ? '' : 's')); render();
}

    case 'cSel': pushHist(); ed.cov = t.value; applyCov(ed.defense, ed.cov); renderInspector(); syncEditor(); break;
    case 'sSit': { const m = SIT[t.value]; if (m){ pushHist(); ed.sit = t.value; ed.spot = m[0]; ed.dist = m[1]; $('#sSpot').value = m[0]; $('#sDist').value = m[1]; syncEditor(); } break; }
    case 'sSpot': pushHist(); ed.spot = Math.max(1, Math.min(99, +t.value || 20)); t.value = ed.spot; ed.dist = Math.min(ed.dist, 100 - ed.spot) || 1; $('#sDist').value = ed.dist; syncEditor(); break;
    case 'sDist': pushHist(); ed.dist = Math.max(1, Math.min(30, +t.value || 10)); t.value = ed.dist; syncEditor(); break;
    case 'fieldPick': S.fieldColor = t.value; save(); draw(); break;
    case 'fieldMarks': S.marks = t.checked; save(); syncEditor(); break;
    case 'fieldDepth': S.showDepth = t.checked; save(); syncEditor(); break;
    case 'dmZone': { const d = ed.rm && ed.defense.find(x => x.id === ed.rm.id); if (d){ pushHist(); d.zone = t.value; d.zoneColor = ZONE_COL[t.value]; if (t.value !== 'none') d.isBlitz = false; renderInspector(); syncEditor(); openDefMenu(d); } break; }
    case 'rmMore': if (t.value){ const q = rmPlayer(); if (q){ ed.sel = {side:'o', id:q.id}; stamp(t.value); const q2 = selObj(); if (q2 && q2.route) openRouteMenu(q2, q2.route.pts.length - 1); } } break;
    case 'fieldYards': S.yards = t.checked; save(); draw(); break;
    case 'sLevel': setLevel(t.value); break;
    case 'penPick': ed.pen = t.value; S.pen = t.value; save(); syncEditor(); break;
    case 'penDash': ed.dash = t.checked; break;
    case 'insLabel': if (o){ pushHist(); o.label = t.value.trim() || 'P'; renderInspector(); syncEditor(); } break;
    case 'insShape': if (o){ pushHist(); o.shape = t.value; syncEditor(); } break;
    case 'insColor': if (o){ pushHist(); o.color = t.value; syncEditor(); } break;
    case 'insRColor': if (o && ed.sel.side === 'o'){ pushHist(); ensureRoute(o).color = t.value; syncEditor(); } break;
    case 'insDefault': if (o && t.checked){ const k = ed.sel.side === 'o' ? 'off' : 'def'; S[k].shape = shapeOf(o, ed.sel.side); S[k].color = colorOf(o, ed.sel.side); save(); toast('Saved as the default style'); } break;
    case 'insZone': if (o){ pushHist(); o.zone = t.value; o.zoneColor = ZONE_COL[t.value]; if (t.value !== 'none') o.isBlitz = false; renderInspector(); syncEditor(); } break;
    case 'insZoneColor': if (o){ pushHist(); o.zoneColor = t.value; syncEditor(); } break;
    case 'insBlitz': if (o){ pushHist(); o.isBlitz = t.checked; if (t.checked){ o.zone = 'none'; o.zoneColor = ZONE_COL.none; } renderInspector(); syncEditor(); } break;
    case 'insGap': if (o){ pushHist(); o.gap = t.value; syncEditor(); } break;
    case 'setOffName': S.off.name = t.value.trim() || 'WR'; save(); break;
    case 'setOffShape': S.off.shape = t.value; save(); break;
    case 'setOffOn': S.off.color = t.checked ? $('#setOffColor').value : ''; save(); break;
    case 'setOffColor': if ($('#setOffOn').checked){ S.off.color = t.value; save(); } break;
    case 'setDefName': S.def.name = t.value.trim() || 'LB'; save(); break;
    case 'setDefShape': S.def.shape = t.value; save(); break;
    case 'setDefColor': S.def.color = t.value; save(); break;
    case 'setSnap': S.snap = t.checked; save(); break;
    case 'setField': S.fieldColor = t.value; save(); break;
    case 'setYards': S.yards = t.checked; save(); break;
    case 'setLevel': S.level = t.value; save(); break;
    case 'setTheme': S.theme = t.value; save(); applyTheme(); break;
  }
});

applyTheme();
save();
render();
})();
</script>
</body>
</html>
