<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHALKBOARD PRO | Football Playbook & Motion Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- FOLDER DASHBOARD VIEW -->
    <div id="dashboardView" class="flex-1 flex flex-col bg-slate-900 overflow-y-auto custom-scrollbar p-6">
        <!-- Top Nav Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-950 font-black p-2.5 rounded-lg text-xl tracking-wider">
                    <i class="fa-solid fa-chalkboard-user mr-1"></i> PRO
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">CHALKBOARD PRO</h1>
                    <p class="text-xs text-slate-400">Playbook Organizer & Motion Simulator</p>
                </div>
            </div>
            <button id="btnNewPlayDashboard" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2.5 rounded-lg text-sm flex items-center shadow-lg transition">
                <i class="fa-solid fa-plus mr-2"></i> Create New Play
            </button>
        </header>

        <!-- Main Dashboard Content -->
        <div class="max-w-7xl w-full mx-auto space-y-6">
            <!-- Folders Section -->
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200 flex items-center">
                    <i class="fa-solid fa-folder-open text-amber-400 mr-2"></i> Playbook Folders
                </h2>
                <button id="btnCreateFolder" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-folder-plus mr-1.5 text-amber-400"></i> New Folder
                </button>
            </div>

            <!-- Folders Grid -->
            <div id="foldersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Dynamically rendered -->
            </div>

            <!-- Saved Plays Section -->
            <div class="pt-6 border-t border-slate-800">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-200 flex items-center">
                        <i class="fa-solid fa-book-open text-emerald-400 mr-2"></i> Saved Plays
                        <span id="activeFolderName" class="ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-400">All Plays</span>
                    </h2>
                    <input type="text" id="playSearchInput" placeholder="Search plays..." class="bg-slate-800 border border-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg focus:outline-none focus:border-amber-500 w-48">
                </div>

                <div id="playsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Dynamically rendered -->
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYBOOK EDITOR / CANVAS VIEW -->
    <div id="editorView" class="hidden flex-1 flex flex-col h-full bg-slate-950 overflow-hidden">
        <!-- Top Toolbar -->
        <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center text-xs">
            <!-- Back & Title -->
            <div class="flex items-center space-x-3">
                <button id="btnBackToDashboard" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded border border-slate-700 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Dashboard
                </button>
                <input type="text" id="playTitleInput" value="Untitled Play" class="bg-slate-800 border border-slate-700 text-amber-400 font-bold px-2 py-1 rounded focus:outline-none focus:border-amber-500 w-44 text-sm">
            </div>

            <!-- Tools & Controls -->
            <div class="flex items-center space-x-2">
                <!-- Drawing Tools -->
                <div class="flex bg-slate-800 p-1 rounded border border-slate-700 space-x-1">
                    <button class="tool-btn px-2.5 py-1 rounded bg-amber-500 text-slate-950 font-semibold" data-tool="select" title="Move Player / Select Vector">
                        <i class="fa-solid fa-hand-pointer"></i> Select
                    </button>
                    <button class="tool-btn px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300" data-tool="route" title="Draw Route">
                        <i class="fa-solid fa-route"></i> Route
                    </button>
                    <button class="tool-btn px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300" data-tool="block" title="Draw Block">
                        <i class="fa-solid fa-shield"></i> Block
                    </button>
                    <button class="tool-btn px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300" data-tool="line" title="Draw Straight Line">
                        <i class="fa-solid fa-slash"></i> Straight
                    </button>
                    <button class="tool-btn px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300" data-tool="motion" title="Draw Pre-Snap Motion">
                        <i class="fa-solid fa-angles-right"></i> Motion
                    </button>
                </div>

                <!-- Field Level Rules -->
                <select id="fieldLevelSelect" class="bg-slate-800 border border-slate-700 text-slate-200 px-2 py-1 rounded focus:outline-none focus:border-amber-500">
                    <option value="hs">High School (53'4" Hashes)</option>
                    <option value="college">College / NCAA (40' Hashes)</option>
                    <option value="nfl">NFL (18'6" Hashes)</option>
                </select>

                <!-- Hash Alignment Shift -->
                <select id="hashShiftSelect" class="bg-slate-800 border border-slate-700 text-slate-200 px-2 py-1 rounded focus:outline-none focus:border-amber-500">
                    <option value="middle">Middle Hash</option>
                    <option value="left">Left Hash</option>
                    <option value="right">Right Hash</option>
                </select>

                <!-- Field Color Theme Customizer -->
                <div class="flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded border border-slate-700">
                    <label class="text-slate-400 font-medium">Turf:</label>
                    <select id="fieldThemeSelect" class="bg-slate-900 border border-slate-700 text-amber-400 font-semibold px-2 py-0.5 rounded focus:outline-none">
                        <option value="white">White Stock (Default)</option>
                        <option value="green">Classic Turf Green</option>
                        <option value="nfl_blue">NFL Midnight Blue</option>
                        <option value="hs_purple">HS Purple Turf</option>
                        <option value="blackout">Blackout Slate</option>
                        <option value="custom">Custom Color...</option>
                    </select>
                    <input type="color" id="fieldCustomColor" value="#ffffff" class="w-6 h-6 rounded cursor-pointer hidden bg-transparent">
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center space-x-2">
                <button id="btnPlayAnimation" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded transition flex items-center">
                    <i class="fa-solid fa-play mr-1.5"></i> Play
                </button>
                <button id="btnResetAnimation" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded border border-slate-700">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button id="btnSavePlay" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Save
                </button>
            </div>
        </div>

        <!-- Editor Canvas Body -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Canvas Container -->
            <div class="flex-1 relative bg-slate-950 flex items-center justify-center p-2">
                <canvas id="playCanvas" class="shadow-2xl rounded border border-slate-800 bg-white cursor-crosshair"></canvas>

                <!-- Floating Timeline Scrub Bar -->
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-slate-700 backdrop-blur px-4 py-2 rounded-xl flex items-center space-x-3 text-xs w-96 shadow-2xl">
                    <span class="text-slate-400 font-mono" id="timeDisplay">0.0s</span>
                    <input type="range" id="timelineScrubber" min="0" max="5" step="0.05" value="0" class="flex-1 accent-amber-500 cursor-pointer">
                    <span class="text-slate-400 font-mono">5.0s</span>
                </div>
            </div>

            <!-- Right Inspector & Defensive Drawer -->
            <div class="w-80 bg-slate-900 border-l border-slate-800 flex flex-col text-xs custom-scrollbar overflow-y-auto">
                <div class="p-3 bg-slate-800/80 border-b border-slate-700 font-bold text-slate-300 flex justify-between items-center">
                    <span><i class="fa-solid fa-sliders text-amber-400 mr-1.5"></i> Inspector & Coaching Notes</span>
                </div>

                <!-- Selected Player Controls -->
                <div id="inspectorPanel" class="p-4 space-y-4 border-b border-slate-800">
                    <p class="text-slate-500 italic text-center py-2">Click any player icon on field to inspect</p>
                </div>

                <!-- Defensive Coaching Notes Panel -->
                <div class="p-4 space-y-3 flex-1 flex flex-col">
                    <h3 class="font-bold text-slate-200 flex items-center">
                        <i class="fa-solid fa-clipboard-list text-emerald-400 mr-1.5"></i> Coaching Notes
                    </h3>
                    
                    <div class="space-y-1">
                        <label class="text-slate-400 text-[11px] font-semibold">Defensive Responsibilities / Checks:</label>
                        <textarea id="defensiveNotesInput" placeholder="Enter defensive assignments, checks, or pre-snap adjustments..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 p-2 rounded focus:outline-none focus:border-emerald-500 h-24 text-xs resize-none"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label class="text-slate-400 text-[11px] font-semibold">Offensive Pre-Snap Expectations:</label>
                        <textarea id="offensiveExpectationsInput" placeholder="What defensive structure or blitz response does offense expect?" class="w-full bg-slate-950 border border-slate-800 text-slate-200 p-2 rounded focus:outline-none focus:border-amber-500 h-24 text-xs resize-none"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- APP SCRIPT -->
    <script>
        // Storage & State Structures
        const STORAGE_KEY_PLAYS = 'chalkboard_pro_plays';
        const STORAGE_KEY_FOLDERS = 'chalkboard_pro_folders';

        const DEFAULT_FOLDERS = ['Red Zone Offense', '3rd & Long', 'Pass Protection', 'Defensive Coverage'];

        // Core App Class
        class ChalkboardApp {
            constructor() {
                this.folders = JSON.parse(localStorage.getItem(STORAGE_KEY_FOLDERS)) || DEFAULT_FOLDERS;
                this.plays = JSON.parse(localStorage.getItem(STORAGE_KEY_PLAYS)) || this.getInitialDefaultPlays();
                
                this.activeFolder = 'ALL';
                this.currentPlay = null;

                // Field Options
                this.fieldTheme = 'white'; // Default white stock
                this.customFieldColor = '#ffffff';
                this.fieldLevel = 'hs'; // hs, college, nfl
                this.hashShift = 'middle'; // middle, left, right

                // Editor Mechanics
                this.activeTool = 'select'; // select, route, block, line, motion
                this.selectedPlayer = null;
                this.selectedVector = null;
                this.isDrawing = false;
                this.currentDrawPath = [];
                
                // Animation State
                this.animating = false;
                this.animTime = 0.0;
                this.animTimer = null;

                this.initDOM();
                this.initCanvas();
                this.renderDashboard();
            }

            getInitialDefaultPlays() {
                return [
                    {
                        id: 'play_1',
                        title: 'Gun Trips Right - Y Choice',
                        folder: 'Red Zone Offense',
                        level: 'hs',
                        hash: 'middle',
                        theme: 'white',
                        notesDef: 'Cover 3 Sky / Check Solo vs Trips',
                        notesOff: 'Expect nickel boundary press; Y choice route vs hook linebacker.',
                        offense: [
                            { id: 'QB', role: 'QB', label: 'QB', x: 0.5, y: 0.70, color: '#0284c7' },
                            { id: 'R', role: 'RB', label: 'R', x: 0.45, y: 0.70, color: '#0284c7' },
                            { id: 'X', role: 'WR', label: 'X', x: 0.15, y: 0.60, color: '#0284c7' },
                            { id: 'Y', role: 'WR', label: 'Y', x: 0.65, y: 0.60, color: '#0284c7' },
                            { id: 'Z', role: 'WR', label: 'Z', x: 0.85, y: 0.60, color: '#0284c7' },
                            { id: 'F', role: 'TE', label: 'F', x: 0.75, y: 0.60, color: '#0284c7' },
                            { id: 'C', role: 'OL', label: 'C', x: 0.50, y: 0.60, color: '#334155' }
                        ],
                        defense: [
                            { id: 'E1', role: 'DE', label: 'E', x: 0.42, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' },
                            { id: 'T1', role: 'DT', label: 'T', x: 0.47, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'A-Gap' },
                            { id: 'T2', role: 'DT', label: 'N', x: 0.53, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' },
                            { id: 'E2', role: 'DE', label: 'E', x: 0.58, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'C-Gap' },
                            { id: 'MLB', role: 'LB', label: 'M', x: 0.50, y: 0.50, color: '#dc2626', zone: 'Hook/Curl', blitzGap: 'none' },
                            { id: 'CB1', role: 'CB', label: 'CB', x: 0.15, y: 0.48, color: '#dc2626', zone: 'Deep 1/3', blitzGap: 'none' }
                        ],
                        routes: []
                    }
                ];
            }

            initDOM() {
                // UI Views
                this.dashboardView = document.getElementById('dashboardView');
                this.editorView = document.getElementById('editorView');

                // Buttons & Nav
                document.getElementById('btnNewPlayDashboard').onclick = () => this.createNewPlay();
                document.getElementById('btnBackToDashboard').onclick = () => this.showDashboard();
                document.getElementById('btnCreateFolder').onclick = () => this.promptCreateFolder();
                document.getElementById('btnSavePlay').onclick = () => this.saveCurrentPlay();

                // Play Title & Search
                document.getElementById('playTitleInput').onchange = (e) => {
                    if (this.currentPlay) this.currentPlay.title = e.target.value;
                };
                document.getElementById('playSearchInput').oninput = (e) => this.renderPlaysGrid(e.target.value);

                // Tools
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('.tool-btn').forEach(b => {
                            b.classList.remove('bg-amber-500', 'text-slate-950', 'font-semibold');
                            b.classList.add('hover:bg-slate-700', 'text-slate-300');
                        });
                        btn.classList.add('bg-amber-500', 'text-slate-950', 'font-semibold');
                        btn.classList.remove('hover:bg-slate-700', 'text-slate-300');
                        this.activeTool = btn.dataset.tool;
                    };
                });

                // Field Theme Customizer
                const themeSelect = document.getElementById('fieldThemeSelect');
                const customColorPicker = document.getElementById('fieldCustomColor');

                themeSelect.onchange = (e) => {
                    this.fieldTheme = e.target.value;
                    if (this.fieldTheme === 'custom') {
                        customColorPicker.classList.remove('hidden');
                    } else {
                        customColorPicker.classList.add('hidden');
                    }
                    this.renderCanvas();
                };

                customColorPicker.oninput = (e) => {
                    this.customFieldColor = e.target.value;
                    this.renderCanvas();
                };

                // Level & Hash Controls
                document.getElementById('fieldLevelSelect').onchange = (e) => {
                    this.fieldLevel = e.target.value;
                    this.renderCanvas();
                };

                document.getElementById('hashShiftSelect').onchange = (e) => {
                    const prevHash = this.hashShift;
                    this.hashShift = e.target.value;
                    this.shiftPlayersByHash(prevHash, this.hashShift);
                    this.renderCanvas();
                };

                // Notes Inputs
                document.getElementById('defensiveNotesInput').oninput = (e) => {
                    if (this.currentPlay) this.currentPlay.notesDef = e.target.value;
                };
                document.getElementById('offensiveExpectationsInput').oninput = (e) => {
                    if (this.currentPlay) this.currentPlay.notesOff = e.target.value;
                };

                // Animation Controls
                document.getElementById('btnPlayAnimation').onclick = () => this.toggleAnimation();
                document.getElementById('btnResetAnimation').onclick = () => this.resetAnimation();
                this.scrubber = document.getElementById('timelineScrubber');
                this.scrubber.oninput = (e) => {
                    this.animTime = parseFloat(e.target.value);
                    document.getElementById('timeDisplay').innerText = `${this.animTime.toFixed(1)}s`;
                    this.renderCanvas();
                };
            }

            // Dashboard Operations
            renderDashboard() {
                this.renderFoldersGrid();
                this.renderPlaysGrid();
            }

            renderFoldersGrid() {
                const grid = document.getElementById('foldersGrid');
                grid.innerHTML = `
                    <div onclick="window.app.filterFolder('ALL')" class="bg-slate-800 hover:bg-slate-700 border ${this.activeFolder === 'ALL' ? 'border-amber-500 bg-slate-800/80' : 'border-slate-700'} p-4 rounded-xl cursor-pointer transition">
                        <div class="flex justify-between items-center">
                            <i class="fa-solid fa-folder text-amber-400 text-2xl"></i>
                            <span class="text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">${this.plays.length} plays</span>
                        </div>
                        <h3 class="font-bold text-sm text-slate-100 mt-2">All Plays</h3>
                    </div>
                `;

                this.folders.forEach(folder => {
                    const count = this.plays.filter(p => p.folder === folder).length;
                    const isActive = this.activeFolder === folder;
                    grid.innerHTML += `
                        <div onclick="window.app.filterFolder('${folder}')" class="bg-slate-800 hover:bg-slate-700 border ${isActive ? 'border-amber-500 bg-slate-800/80' : 'border-slate-700'} p-4 rounded-xl cursor-pointer transition">
                            <div class="flex justify-between items-center">
                                <i class="fa-solid fa-folder text-amber-400 text-2xl"></i>
                                <span class="text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-400">${count} plays</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-100 mt-2">${folder}</h3>
                        </div>
                    `;
                });
            }

            renderPlaysGrid(query = '') {
                const grid = document.getElementById('playsGrid');
                let filtered = this.plays;

                if (this.activeFolder !== 'ALL') {
                    filtered = filtered.filter(p => p.folder === this.activeFolder);
                }

                if (query) {
                    filtered = filtered.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));
                }

                document.getElementById('activeFolderName').innerText = this.activeFolder === 'ALL' ? 'All Plays' : this.activeFolder;

                if (filtered.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">No saved plays found in this folder.</p>`;
                    return;
                }

                grid.innerHTML = filtered.map(play => `
                    <div class="bg-slate-800 border border-slate-700 hover:border-amber-500 rounded-xl p-4 flex flex-col justify-between transition group">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">${play.folder || 'Unassigned'}</span>
                                <button onclick="window.app.deletePlay('${play.id}')" class="text-slate-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <h3 class="font-bold text-slate-100 text-base group-hover:text-amber-400 transition">${play.title}</h3>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${play.notesOff || 'No offensive notes attached.'}</p>
                        </div>
                        <div class="pt-4 mt-4 border-t border-slate-700/60 flex justify-between items-center">
                            <span class="text-[10px] text-slate-500 uppercase font-mono">${play.level.toUpperCase()} FIELD</span>
                            <button onclick="window.app.loadPlay('${play.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded text-xs transition">
                                Open Play
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            filterFolder(folder) {
                this.activeFolder = folder;
                this.renderDashboard();
            }

            promptCreateFolder() {
                const name = prompt('Enter new folder name:');
                if (name && !this.folders.includes(name)) {
                    this.folders.push(name);
                    localStorage.setItem(STORAGE_KEY_FOLDERS, JSON.stringify(this.folders));
                    this.renderDashboard();
                }
            }

            createNewPlay() {
                const newPlay = {
                    id: 'play_' + Date.now(),
                    title: 'New Play',
                    folder: this.activeFolder === 'ALL' ? (this.folders[0] || 'Red Zone Offense') : this.activeFolder,
                    level: 'hs',
                    hash: 'middle',
                    theme: 'white',
                    notesDef: '',
                    notesOff: '',
                    offense: [
                        { id: 'QB', role: 'QB', label: 'QB', x: 0.5, y: 0.70, color: '#0284c7' },
                        { id: 'R', role: 'RB', label: 'R', x: 0.45, y: 0.70, color: '#0284c7' },
                        { id: 'X', role: 'WR', label: 'X', x: 0.15, y: 0.60, color: '#0284c7' },
                        { id: 'Y', role: 'WR', label: 'Y', x: 0.65, y: 0.60, color: '#0284c7' },
                        { id: 'Z', role: 'WR', label: 'Z', x: 0.85, y: 0.60, color: '#0284c7' },
                        { id: 'F', role: 'TE', label: 'F', x: 0.75, y: 0.60, color: '#0284c7' },
                        { id: 'C', role: 'OL', label: 'C', x: 0.50, y: 0.60, color: '#334155' }
                    ],
                    defense: [
                        { id: 'E1', role: 'DE', label: 'E', x: 0.42, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' },
                        { id: 'T1', role: 'DT', label: 'T', x: 0.47, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' },
                        { id: 'T2', role: 'DT', label: 'N', x: 0.53, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' },
                        { id: 'E2', role: 'DE', label: 'E', x: 0.58, y: 0.57, color: '#dc2626', zone: 'none', blitzGap: 'none' }
                    ],
                    routes: []
                };

                this.plays.push(newPlay);
                this.loadPlay(newPlay.id);
            }

            loadPlay(playId) {
                this.currentPlay = this.plays.find(p => p.id === playId) || this.plays[0];
                document.getElementById('playTitleInput').value = this.currentPlay.title;
                document.getElementById('defensiveNotesInput').value = this.currentPlay.notesDef || '';
                document.getElementById('offensiveExpectationsInput').value = this.currentPlay.notesOff || '';

                this.fieldLevel = this.currentPlay.level || 'hs';
                document.getElementById('fieldLevelSelect').value = this.fieldLevel;

                this.hashShift = this.currentPlay.hash || 'middle';
                document.getElementById('hashShiftSelect').value = this.hashShift;

                this.fieldTheme = this.currentPlay.theme || 'white';
                document.getElementById('fieldThemeSelect').value = this.fieldTheme;

                this.dashboardView.classList.add('hidden');
                this.editorView.classList.remove('hidden');

                this.selectedPlayer = null;
                this.selectedVector = null;
                this.resetAnimation();
                this.resizeCanvas();
            }

            saveCurrentPlay() {
                if (!this.currentPlay) return;
                this.currentPlay.level = this.fieldLevel;
                this.currentPlay.hash = this.hashShift;
                this.currentPlay.theme = this.fieldTheme;

                const idx = this.plays.findIndex(p => p.id === this.currentPlay.id);
                if (idx !== -1) {
                    this.plays[idx] = this.currentPlay;
                } else {
                    this.plays.push(this.currentPlay);
                }

                localStorage.setItem(STORAGE_KEY_PLAYS, JSON.stringify(this.plays));
                alert('Play saved successfully!');
            }

            deletePlay(playId) {
                if (confirm('Delete this play permanently?')) {
                    this.plays = this.plays.filter(p => p.id !== playId);
                    localStorage.setItem(STORAGE_KEY_PLAYS, JSON.stringify(this.plays));
                    this.renderDashboard();
                }
            }

            showDashboard() {
                this.editorView.classList.add('hidden');
                this.dashboardView.classList.remove('hidden');
                this.renderDashboard();
            }

            // Canvas & Field Mechanics
            initCanvas() {
                this.canvas = document.getElementById('playCanvas');
                this.ctx = this.canvas.getContext('2d');

                window.addEventListener('resize', () => this.resizeCanvas());

                // Interaction Listeners
                this.canvas.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
                this.canvas.addEventListener('pointermove', (e) => this.handlePointerMove(e));
                this.canvas.addEventListener('pointerup', (e) => this.handlePointerUp(e));
            }

            resizeCanvas() {
                const parent = this.canvas.parentElement;
                const rect = parent.getBoundingClientRect();
                this.canvas.width = Math.min(rect.width - 20, 1100);
                this.canvas.height = Math.min(rect.height - 20, 750);
                this.renderCanvas();
            }

            // Dynamic Hash Shift Calculation
            shiftPlayersByHash(prevHash, newHash) {
                if (prevHash === newHash) return;
                let dx = 0;
                if (prevHash === 'middle' && newHash === 'left') dx = -0.12;
                else if (prevHash === 'middle' && newHash === 'right') dx = 0.12;
                else if (prevHash === 'left' && newHash === 'middle') dx = 0.12;
                else if (prevHash === 'right' && newHash === 'middle') dx = -0.12;
                else if (prevHash === 'left' && newHash === 'right') dx = 0.24;
                else if (prevHash === 'right' && newHash === 'left') dx = -0.24;

                if (!this.currentPlay) return;

                // Shift players AND their route anchors simultaneously
                this.currentPlay.offense.forEach(p => {
                    p.x = Math.max(0.05, Math.min(0.95, p.x + dx));
                });
                this.currentPlay.defense.forEach(p => {
                    p.x = Math.max(0.05, Math.min(0.95, p.x + dx));
                });

                if (this.currentPlay.routes) {
                    this.currentPlay.routes.forEach(r => {
                        r.points.forEach(pt => {
                            pt.x = Math.max(0.05, Math.min(0.95, pt.x + dx));
                        });
                    });
                }
            }

            // Canvas Rendering Pipeline
            renderCanvas() {
                if (!this.ctx || !this.currentPlay) return;

                const width = this.canvas.width;
                const height = this.canvas.height;

                // 1. Render Custom Background Theme
                let bgHex = '#ffffff'; // Stock White
                let isDarkBg = false;

                switch (this.fieldTheme) {
                    case 'green': bgHex = '#15803d'; isDarkBg = true; break;
                    case 'nfl_blue': bgHex = '#1e3a8a'; isDarkBg = true; break;
                    case 'hs_purple': bgHex = '#581c87'; isDarkBg = true; break;
                    case 'blackout': bgHex = '#0f172a'; isDarkBg = true; break;
                    case 'custom': bgHex = this.customFieldColor; isDarkBg = this.isColorDark(bgHex); break;
                    default: bgHex = '#ffffff'; isDarkBg = false;
                }

                this.ctx.fillStyle = bgHex;
                this.ctx.fillRect(0, 0, width, height);

                // Line Color based on contrast
                const lineColor = isDarkBg ? 'rgba(255, 255, 255, 0.7)' : 'rgba(15, 23, 42, 0.6)';
                const hashColor = isDarkBg ? 'rgba(255, 255, 255, 0.9)' : 'rgba(15, 23, 42, 0.8)';

                // 2. Yard Lines & Hashes
                this.ctx.strokeStyle = lineColor;
                this.ctx.lineWidth = 1.5;

                // Yard Lines (Every 10 yards vertically)
                for (let y = 0.1; y <= 0.9; y += 0.1) {
                    const canvasY = y * height;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, canvasY);
                    this.ctx.lineTo(width, canvasY);
                    this.ctx.stroke();
                }

                // Field Level Hash Mark Spacing
                let leftHashX = 0.35;
                let rightHashX = 0.65;

                if (this.fieldLevel === 'nfl') {
                    // NFL 18'6" Hashes (Narrow)
                    leftHashX = 0.43;
                    rightHashX = 0.57;
                } else if (this.fieldLevel === 'college') {
                    // College 40' Hashes (Medium)
                    leftHashX = 0.38;
                    rightHashX = 0.62;
                } else {
                    // High School 53'4" Hashes (Wide)
                    leftHashX = 0.33;
                    rightHashX = 0.67;
                }

                // Draw Hashes along yard lines
                this.ctx.strokeStyle = hashColor;
                this.ctx.lineWidth = 2;
                for (let y = 0.15; y <= 0.85; y += 0.05) {
                    const canvasY = y * height;
                    // Left Hash
                    this.ctx.beginPath();
                    this.ctx.moveTo(leftHashX * width - 8, canvasY);
                    this.ctx.lineTo(leftHashX * width + 8, canvasY);
                    this.ctx.stroke();

                    // Right Hash
                    this.ctx.beginPath();
                    this.ctx.moveTo(rightHashX * width - 8, canvasY);
                    this.ctx.lineTo(rightHashX * width + 8, canvasY);
                    this.ctx.stroke();
                }

                // Line of Scrimmage Indicator
                const losY = 0.60 * height;
                this.ctx.strokeStyle = '#0284c7';
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([6, 6]);
                this.ctx.beginPath();
                this.ctx.moveTo(0, losY);
                this.ctx.lineTo(width, losY);
                this.ctx.stroke();
                this.ctx.setLineDash([]);

                // 3. Render Defensive Zones Overlay
                this.currentPlay.defense.forEach(def => {
                    if (def.zone && def.zone !== 'none') {
                        this.renderDefensiveZone(def, width, height);
                    }
                });

                // 4. Render Routes & Vectors
                if (this.currentPlay.routes) {
                    this.currentPlay.routes.forEach(r => this.renderVector(r, width, height));
                }

                // 5. Render Players
                const allPlayers = [...this.currentPlay.offense, ...this.currentPlay.defense];
                allPlayers.forEach(player => {
                    // Compute animated position
                    const pos = this.getAnimatedPlayerPosition(player, width, height);
                    this.renderPlayerIcon(player, pos.x, pos.y);
                });

                // 6. Draw in progress line
                if (this.isDrawing && this.currentDrawPath.length > 1) {
                    this.ctx.strokeStyle = '#f59e0b';
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.currentDrawPath[0].x * width, this.currentDrawPath[0].y * height);
                    for (let i = 1; i < this.currentDrawPath.length; i++) {
                        this.ctx.lineTo(this.currentDrawPath[i].x * width, this.currentDrawPath[i].y * height);
                    }
                    this.ctx.stroke();
                }
            }

            isColorDark(hex) {
                if (hex.startsWith('#')) hex = hex.slice(1);
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const r = parseInt(hex.substr(0, 2), 16);
                const g = parseInt(hex.substr(2, 2), 16);
                const b = parseInt(hex.substr(4, 2), 16);
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                return brightness < 128;
            }

            renderDefensiveZone(def, width, height) {
                const x = def.x * width;
                const y = def.y * height;
                this.ctx.save();

                this.ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                this.ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                this.ctx.lineWidth = 1.5;

                this.ctx.beginPath();
                if (def.zone === 'Flat') {
                    this.ctx.ellipse(x, y - 20, 70, 35, 0, 0, Math.PI * 2);
                } else if (def.zone === 'Hook/Curl') {
                    this.ctx.ellipse(x, y - 30, 60, 50, 0, 0, Math.PI * 2);
                } else if (def.zone === 'Deep 1/3' || def.zone === 'Deep 1/2') {
                    this.ctx.ellipse(x, y - 80, 100, 70, 0, 0, Math.PI * 2);
                } else {
                    this.ctx.arc(x, y - 40, 45, 0, Math.PI * 2);
                }
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.fillStyle = '#ef4444';
                this.ctx.font = 'bold 10px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(def.zone.toUpperCase(), x, y - 35);

                this.ctx.restore();
            }

            renderVector(route, width, height) {
                if (!route.points || route.points.length < 2) return;

                this.ctx.save();
                this.ctx.strokeStyle = route.color || '#f59e0b';
                this.ctx.lineWidth = 3;

                if (route.type === 'motion') {
                    this.ctx.setLineDash([5, 5]);
                }

                this.ctx.beginPath();
                this.ctx.moveTo(route.points[0].x * width, route.points[0].y * height);
                for (let i = 1; i < route.points.length; i++) {
                    this.ctx.lineTo(route.points[i].x * width, route.points[i].y * height);
                }
                this.ctx.stroke();
                this.ctx.setLineDash([]);

                // Draw Endcap (Arrow or Block)
                const lastPt = route.points[route.points.length - 1];
                const prevPt = route.points[route.points.length - 2];
                const angle = Math.atan2((lastPt.y - prevPt.y) * height, (lastPt.x - prevPt.x) * width);

                const endX = lastPt.x * width;
                const endY = lastPt.y * height;

                if (route.type === 'block') {
                    // Block T-Bar
                    this.ctx.beginPath();
                    this.ctx.moveTo(endX + Math.cos(angle + Math.PI / 2) * 10, endY + Math.sin(angle + Math.PI / 2) * 10);
                    this.ctx.lineTo(endX - Math.cos(angle + Math.PI / 2) * 10, endY - Math.sin(angle + Math.PI / 2) * 10);
                    this.ctx.stroke();
                } else {
                    // Arrow Head
                    this.ctx.fillStyle = route.color || '#f59e0b';
                    this.ctx.beginPath();
                    this.ctx.moveTo(endX, endY);
                    this.ctx.lineTo(endX - Math.cos(angle - Math.PI / 6) * 12, endY - Math.sin(angle - Math.PI / 6) * 12);
                    this.ctx.lineTo(endX - Math.cos(angle + Math.PI / 6) * 12, endY - Math.sin(angle + Math.PI / 6) * 12);
                    this.ctx.closePath();
                    this.ctx.fill();
                }

                this.ctx.restore();
            }

            renderPlayerIcon(player, x, y) {
                const isSelected = this.selectedPlayer && this.selectedPlayer.id === player.id;
                const radius = 14;

                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fillStyle = player.color || '#0284c7';
                this.ctx.fill();

                this.ctx.lineWidth = isSelected ? 3 : 1.5;
                this.ctx.strokeStyle = isSelected ? '#f59e0b' : '#ffffff';
                this.ctx.stroke();

                // Player Label Text
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 11px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(player.label, x, y);

                this.ctx.restore();
            }

            // Motion & Route Animation Engine
            getAnimatedPlayerPosition(player, width, height) {
                const startX = player.x * width;
                const startY = player.y * height;

                if (this.animTime === 0) return { x: startX, y: startY };

                const route = this.currentPlay.routes.find(r => r.playerId === player.id);
                
                // Static non-route players stay at pre-snap position
                if (!route || !route.points || route.points.length < 2) {
                    return { x: startX, y: startY };
                }

                // Pre-snap motion runs first (0.0s to 1.5s), routes run (1.5s to 5.0s)
                let progress = 0;
                if (route.type === 'motion') {
                    progress = Math.min(1.0, this.animTime / 1.5);
                } else {
                    if (this.animTime < 1.0) return { x: startX, y: startY }; // Wait for snap
                    progress = Math.min(1.0, (this.animTime - 1.0) / 4.0);
                }

                const totalPts = route.points.length;
                const currIndex = Math.min(totalPts - 1, Math.floor(progress * (totalPts - 1)));
                const nextIndex = Math.min(totalPts - 1, currIndex + 1);
                const segmentProgress = (progress * (totalPts - 1)) - currIndex;

                const pt1 = route.points[currIndex];
                const pt2 = route.points[nextIndex];

                return {
                    x: (pt1.x + (pt2.x - pt1.x) * segmentProgress) * width,
                    y: (pt1.y + (pt2.y - pt1.y) * segmentProgress) * height
                };
            }

            // Pointer & Drawing Mechanics
            handlePointerDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.canvas.width;
                const y = (e.clientY - rect.top) / this.canvas.height;

                const allPlayers = [...this.currentPlay.offense, ...this.currentPlay.defense];
                const clickedPlayer = allPlayers.find(p => {
                    const dx = (p.x - x) * this.canvas.width;
                    const dy = (p.y - y) * this.canvas.height;
                    return Math.sqrt(dx * dx + dy * dy) <= 16;
                });

                if (clickedPlayer) {
                    this.selectedPlayer = clickedPlayer;
                    this.renderInspector();

                    if (this.activeTool !== 'select') {
                        this.isDrawing = true;
                        this.currentDrawPath = [{ x: clickedPlayer.x, y: clickedPlayer.y }, { x, y }];
                    }
                } else if (this.activeTool === 'select') {
                    this.selectedPlayer = null;
                    this.renderInspector();
                }

                this.renderCanvas();
            }

            handlePointerMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = Math.max(0.02, Math.min(0.98, (e.clientX - rect.left) / this.canvas.width));
                const y = Math.max(0.02, Math.min(0.98, (e.clientY - rect.top) / this.canvas.height));

                if (this.isDrawing) {
                    if (this.activeTool === 'line') {
                        // Straight Line Tool Lock
                        this.currentDrawPath = [this.currentDrawPath[0], { x, y }];
                    } else {
                        this.currentDrawPath.push({ x, y });
                    }
                    this.renderCanvas();
                } else if (this.selectedPlayer && e.buttons === 1 && this.activeTool === 'select') {
                    // Drag Player Position
                    const dx = x - this.selectedPlayer.x;
                    const dy = y - this.selectedPlayer.y;

                    this.selectedPlayer.x = x;
                    this.selectedPlayer.y = y;

                    // Move route alongside player
                    const route = this.currentPlay.routes.find(r => r.playerId === this.selectedPlayer.id);
                    if (route && route.points.length > 0) {
                        route.points.forEach(pt => {
                            pt.x += dx;
                            pt.y += dy;
                        });
                    }

                    this.renderCanvas();
                }
            }

            handlePointerUp() {
                if (this.isDrawing && this.selectedPlayer && this.currentDrawPath.length > 1) {
                    // Save drawn vector
                    const newRoute = {
                        id: 'route_' + Date.now(),
                        playerId: this.selectedPlayer.id,
                        type: this.activeTool,
                        color: this.selectedPlayer.color || '#f59e0b',
                        points: [...this.currentDrawPath]
                    };

                    // Replace existing route for player
                    this.currentPlay.routes = this.currentPlay.routes.filter(r => r.playerId !== this.selectedPlayer.id);
                    this.currentPlay.routes.push(newRoute);
                }

                this.isDrawing = false;
                this.currentDrawPath = [];
                this.renderCanvas();
            }

            // Inspector Panel Dynamic Rendering
            renderInspector() {
                const panel = document.getElementById('inspectorPanel');
                if (!this.selectedPlayer) {
                    panel.innerHTML = `<p class="text-slate-500 italic text-center py-2">Click any player icon on field to inspect</p>`;
                    return;
                }

                const p = this.selectedPlayer;
                const isDefense = this.currentPlay.defense.some(d => d.id === p.id);

                panel.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                            <span class="font-bold text-amber-400 text-sm">Player: ${p.label} (${p.role})</span>
                            <button onclick="window.app.deleteSelectedPlayer()" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash mr-1"></i> Remove</button>
                        </div>

                        <!-- Icon Color Customizer -->
                        <div class="flex justify-between items-center">
                            <label class="text-slate-400">Icon Color:</label>
                            <input type="color" id="playerColorPicker" value="${p.color || '#0284c7'}" class="w-8 h-6 rounded cursor-pointer bg-transparent border border-slate-700">
                        </div>

                        ${isDefense ? `
                            <!-- Defensive Zone Selection -->
                            <div class="space-y-1">
                                <label class="text-slate-400">Defensive Zone Overlay:</label>
                                <select id="zoneSelect" class="w-full bg-slate-950 border border-slate-800 text-slate-200 p-1.5 rounded focus:outline-none focus:border-emerald-500">
                                    <option value="none" ${p.zone === 'none' ? 'selected' : ''}>None (Man Cover)</option>
                                    <option value="Flat" ${p.zone === 'Flat' ? 'selected' : ''}>Flat Zone</option>
                                    <option value="Hook/Curl" ${p.zone === 'Hook/Curl' ? 'selected' : ''}>Hook / Curl Zone</option>
                                    <option value="Deep 1/3" ${p.zone === 'Deep 1/3' ? 'selected' : ''}>Deep 1/3 Zone</option>
                                    <option value="Deep 1/2" ${p.zone === 'Deep 1/2' ? 'selected' : ''}>Deep 1/2 Zone</option>
                                </select>
                            </div>

                            <!-- Gap Blitz Target Picker -->
                            <div class="space-y-1 pt-2">
                                <label class="text-slate-400">Target Blitz Gap:</label>
                                <select id="blitzGapSelect" class="w-full bg-slate-950 border border-slate-800 text-slate-200 p-1.5 rounded focus:outline-none focus:border-red-500">
                                    <option value="none" ${p.blitzGap === 'none' ? 'selected' : ''}>No Blitz Target</option>
                                    <option value="A-Gap" ${p.blitzGap === 'A-Gap' ? 'selected' : ''}>A-Gap Blitz</option>
                                    <option value="B-Gap" ${p.blitzGap === 'B-Gap' ? 'selected' : ''}>B-Gap Blitz</option>
                                    <option value="C-Gap" ${p.blitzGap === 'C-Gap' ? 'selected' : ''}>C-Gap Blitz</option>
                                    <option value="Edge" ${p.blitzGap === 'Edge' ? 'selected' : ''}>Edge / Off-Pass Rush</option>
                                </select>
                            </div>
                        ` : `
                            <p class="text-slate-400 text-[11px]">Use top toolbar to draw routes, blocks, or motion for ${p.label}.</p>
                        `}
                    </div>
                `;

                // Bind Events
                document.getElementById('playerColorPicker').oninput = (e) => {
                    p.color = e.target.value;
                    this.renderCanvas();
                };

                if (isDefense) {
                    document.getElementById('zoneSelect').onchange = (e) => {
                        p.zone = e.target.value;
                        this.renderCanvas();
                    };
                    document.getElementById('blitzGapSelect').onchange = (e) => {
                        p.blitzGap = e.target.value;
                        if (p.blitzGap !== 'none') {
                            this.generateGapBlitzVector(p);
                        }
                        this.renderCanvas();
                    };
                }
            }

            generateGapBlitzVector(defender) {
                let targetX = defender.x;
                const targetY = 0.60; // Line of scrimmage

                if (defender.blitzGap === 'A-Gap') targetX = 0.48;
                else if (defender.blitzGap === 'B-Gap') targetX = 0.44;
                else if (defender.blitzGap === 'C-Gap') targetX = 0.40;
                else if (defender.blitzGap === 'Edge') targetX = 0.35;

                const blitzRoute = {
                    id: 'route_' + Date.now(),
                    playerId: defender.id,
                    type: 'route',
                    color: '#dc2626',
                    points: [
                        { x: defender.x, y: defender.y },
                        { x: targetX, y: targetY }
                    ]
                };

                this.currentPlay.routes = this.currentPlay.routes.filter(r => r.playerId !== defender.id);
                this.currentPlay.routes.push(blitzRoute);
            }

            deleteSelectedPlayer() {
                if (!this.selectedPlayer) return;
                this.currentPlay.offense = this.currentPlay.offense.filter(p => p.id !== this.selectedPlayer.id);
                this.currentPlay.defense = this.currentPlay.defense.filter(p => p.id !== this.selectedPlayer.id);
                this.currentPlay.routes = this.currentPlay.routes.filter(r => r.playerId !== this.selectedPlayer.id);
                this.selectedPlayer = null;
                this.renderInspector();
                this.renderCanvas();
            }

            // Play / Pause Animation Loop
            toggleAnimation() {
                if (this.animating) {
                    this.stopAnimation();
                } else {
                    this.startAnimation();
                }
            }

            startAnimation() {
                this.animating = true;
                document.getElementById('btnPlayAnimation').innerHTML = `<i class="fa-solid fa-pause mr-1.5"></i> Pause`;

                const startTime = performance.now() - (this.animTime * 1000);
                const step = (now) => {
                    if (!this.animating) return;
                    this.animTime = (now - startTime) / 1000;
                    if (this.animTime >= 5.0) {
                        this.animTime = 5.0;
                        this.stopAnimation();
                    }
                    this.scrubber.value = this.animTime;
                    document.getElementById('timeDisplay').innerText = `${this.animTime.toFixed(1)}s`;
                    this.renderCanvas();
                    if (this.animating) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }

            stopAnimation() {
                this.animating = false;
                document.getElementById('btnPlayAnimation').innerHTML = `<i class="fa-solid fa-play mr-1.5"></i> Play`;
            }

            resetAnimation() {
                this.stopAnimation();
                this.animTime = 0.0;
                this.scrubber.value = 0;
                document.getElementById('timeDisplay').innerText = `0.0s`;
                this.renderCanvas();
            }
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            window.app = new ChalkboardApp();
        });
    </script>
</body>
</html>
