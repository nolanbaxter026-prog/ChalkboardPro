<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChalkboardPro</title>
<style>
:root{
  --bg:#e9eee9; --panel:#ffffff; --ink:#16241d; --muted:#5d6e64; --line:#cfd8d1;
  --accent:#1d5a40; --accent-ink:#ffffff; --board:#274d3d; --chalk:#f6f4ec; --warn:#a5372a; --yellow:#f2c94c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --panel:#19221d; --ink:#e9efe9; --muted:#97a89d; --line:#2b3830;
    --accent:#58bd8c; --accent-ink:#0b120e; --board:#1d3a2d; --warn:#ee8472;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --panel:#19221d; --ink:#e9efe9; --muted:#97a89d; --line:#2b3830;
  --accent:#58bd8c; --accent-ink:#0b120e; --board:#1d3a2d; --warn:#ee8472;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font:700 21px/1 Rockwell,"Roboto Slab","Courier New",Georgia,serif}
header span{color:var(--muted);font-size:13px}
main{flex:1;overflow:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel)}
nav button{border:0;background:none;color:var(--muted);padding:9px 2px 8px;font:600 12px/1.2 system-ui,sans-serif;cursor:pointer}
nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:1px}
nav button[aria-current="true"]{color:var(--accent)}
h2{font:700 18px/1.2 Rockwell,"Roboto Slab",Georgia,serif;margin:4px 0 10px}
h3{font:700 15px/1.2 Rockwell,"Roboto Slab",Georgia,serif;margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.board{position:relative;background:transparent;border:0;padding:0;margin:0}
.top{position:absolute;top:8px;left:8px;right:8px;z-index:2;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.fbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:2px 2px 6px;pointer-events:none;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar>*{flex:none}
.sec{margin-bottom:10px}
.sec .row{flex-wrap:nowrap}
.sec input{flex:1;min-width:0}
.cmd{position:absolute;left:8px;right:8px;bottom:58px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.cmd[hidden]{display:none}
.chat{max-height:46vh;overflow:auto;margin:8px 0}
.bub{padding:8px 10px;border-radius:12px;margin-bottom:6px;white-space:pre-wrap;font-size:14px}
.bub.me{background:var(--accent);color:var(--accent-ink);margin-left:24px}
.bub.ai{background:var(--bg);border:1px solid var(--line);margin-right:24px}
.dterm{border-bottom:1px solid var(--line);padding:8px 0}
.dterm b{display:block}
.dterm small{color:var(--muted)}
.nstyle{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.nrow{display:grid;grid-template-columns:1fr 1.3fr 44px;gap:8px;align-items:center;margin:6px 0}
.nrow>span{font-size:13px;color:var(--muted);font-weight:600}
.nrow input[type=color]{width:44px;height:34px;padding:0}
.prow{display:grid;grid-template-columns:30px 1fr 1.4fr 40px 34px;gap:6px;align-items:center;margin:5px 0}
.prow input,.prow select{min-width:0;width:100%;box-sizing:border-box}
.prow input[type=color]{padding:0;height:34px}
.hl{background:#fde047;color:#111;border-radius:3px;padding:0 2px}
.dcount{margin:2px 0 6px}
.dsearch{position:relative}.dsearch input{width:100%;box-sizing:border-box;padding-right:38px}
.dclr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:15px;padding:6px 8px;cursor:pointer}
.dsearch input::-webkit-search-cancel-button{display:none}
.gate{position:fixed;inset:0;z-index:50;background:#0a0f1e;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.gate .box{background:#131a2e;border:1px solid #26304d;border-radius:18px;padding:22px;max-width:420px;width:100%;color:#e8ecf8;margin:auto}
.gate label{color:#c5cde6;font-weight:600;font-size:12px}
.gate label small{color:#7f8bb0;font-weight:400}
.gate input,.gate select{background:#1d2742;border:1px solid #33406a;color:#fff;border-radius:9px;padding:10px;font-size:13px}
.gate .logo{display:inline-flex;background:#059669;border-radius:16px;padding:12px;font-size:30px;margin-bottom:6px}
.gate h1{font:900 24px/1.1 system-ui,sans-serif;letter-spacing:.5px;margin:4px 0}
.gate .sub{color:#94a0c4;font-size:12px}
.gate .pill{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:#6ee7b7;background:#052e24;border:1px solid #065f46;border-radius:99px;padding:3px 10px}
.gate .gbtn{width:100%;border:0;border-radius:12px;padding:14px;font:700 14px system-ui,sans-serif;color:#fff;cursor:pointer;margin:16px 0 6px}
.gate .gbtn.green{background:#10b981}
.gate .gbtn.blue{background:#2563eb;margin-top:12px;border-radius:10px;font-size:13px}
.gate .or{display:flex;align-items:center;gap:10px;color:#7f8bb0;font:700 10px system-ui,sans-serif;letter-spacing:1px;margin:12px 0}
.gate .or:before,.gate .or:after{content:"";flex:1;border-top:1px solid #26304d}
.gate .gtabs{display:flex;background:#0a0f1e;border:1px solid #26304d;border-radius:12px;padding:4px;margin-bottom:12px}
.gate .gtabs button{flex:1;border:0;background:none;color:#94a0c4;padding:9px;border-radius:9px;font:700 12px system-ui,sans-serif;cursor:pointer}
.gate .gtabs button[aria-pressed="true"]{background:#26304d;color:#fff}
.gate .gnote{color:#94a0c4;font-size:11px;line-height:1.4;margin:10px 0 0}
.gate .gstat{background:#0a0f1e;border:1px solid #26304d;border-radius:10px;padding:9px 10px;font-size:12px;color:#c5cde6;margin-bottom:10px}
.gate .glink{background:none;border:0;color:#7f8bb0;font:600 12px system-ui,sans-serif;text-decoration:underline;cursor:pointer;margin-top:10px;padding:0}
.gate[hidden]{display:none}
.peers{margin-left:auto;display:flex;gap:4px;align-items:center}
.peer{width:24px;height:24px;border-radius:50%;color:#fff;font:700 11px/24px system-ui,sans-serif;text-align:center}
.fbar>*{pointer-events:auto;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.fbar .btn.sm{padding:6px 8px;font-size:12px}
.fbar .seg button{padding:6px 9px;font-size:12px}
.rmenu{position:absolute;z-index:3;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13px}
.rmenu[hidden]{display:none}
.rmenu .chip{padding:5px 9px;font-size:12px}
.rmenu select{padding:6px}
main.design{padding:0 0 24px}
.hint{align-self:flex-start;background:rgba(22,36,29,.82);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px}
.warn{align-self:flex-start;background:#7a2a1d;color:#fff;font-size:12px;padding:6px 8px;border-radius:6px}
#field{width:100%;height:70vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.bar,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.card .row:last-child{margin-bottom:0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:8px;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);padding:8px 11px;font:600 13px/1 system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label:first-child{margin-top:0}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0}
label.chk input{width:auto}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
input[type=color]{padding:2px;height:36px;min-width:44px}
input[type=range]{padding:0;border:0;background:none}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:99px;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--yellow)}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:12px;font:700 15px/1.2 Rockwell,"Roboto Slab",Georgia,serif;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted)}
details.card[open]>summary::after{content:"▴"}
details.card>.body{padding:0 12px 12px}
.dright{padding:12px 12px 0}
.dgrid{display:block}
@media(min-width:900px){.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;align-items:start}.dleft{position:sticky;top:0}.dright{padding:12px 12px 0 0}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.play{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.play svg{display:block;width:100%;height:auto;cursor:pointer}
.play .meta{padding:8px 9px 4px}
.play .meta b{display:block;font-size:14px;line-height:1.2}
.play .meta small,.note{color:var(--muted);font-size:13px}
.play .acts{display:flex;gap:4px;padding:4px 7px 8px;flex-wrap:wrap}
.fold{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.fold b{display:block;font-size:15px}
.fold small{color:var(--muted)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:13px}
.crumb button{border:0;background:none;color:var(--accent);font:600 13px system-ui,sans-serif;padding:2px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:1px dashed var(--line);border-radius:10px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.item svg{width:52px;height:auto;border-radius:4px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted)}
.item .n{width:22px;text-align:center;color:var(--muted);font-weight:700}
.lib{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 9px;border-radius:7px;margin-bottom:4px;font:14px system-ui,sans-serif;cursor:pointer}
#libList{max-height:190px;overflow:auto;margin-top:6px}
.rrow{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px}
.link{background:none;border:0;color:var(--accent);font:600 14px system-ui,sans-serif;padding:4px 0;cursor:pointer;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:12px;padding:14px;width:100%;max-width:460px;max-height:86vh;overflow:auto}
.modal textarea{min-height:130px;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;max-width:90%}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>ChalkboardPro</h1><span>Free football playbook</span><div class="peers" id="peers"></div></header>
<main id="main"></main>
<nav id="tabs">
  <button data-act="tab" data-id="design"><b>✏️</b>Designer</button>
  <button data-act="tab" data-id="book"><b>📋</b>Playbook</button>
  <button data-act="tab" data-id="plans"><b>🗒️</b>Game plans</button>
  <button data-act="tab" data-id="learn"><b>📖</b>Learn</button>
  <button data-act="tab" data-id="settings"><b>⚙️</b>Settings</button>
</nav>
<div class="gate" id="gate" hidden></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = n => Math.round(n * 10) / 10;
const PX = 6.75, LOS = 299, LINE = 308;
let VB = {x0:0, y0:0, x1:360, y1:480};
const cx = v => Math.max(VB.x0 + 14, Math.min(VB.x1 - 14, v));
const cy = v => Math.max(VB.y0 + 14, Math.min(VB.y1 - 14, v));
function lum(h){ h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); if (isNaN(n)) return .5; return (.299 * (n >> 16 & 255) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; }

/* ---------- routes (yards: [toward sideline, upfield] from the player's start) ---------- */
const ROUTES = [
['go','Go / Fly / Streak',20,D=>[[0,D]],'Vertical release, straight upfield.'],
['fade','Fade',20,D=>[[1,D*.5],[3,D]],'Vertical, bending toward the sideline.'],
['slant','Slant',5,D=>[[0,1.5],[-(D-1.5),D]],'1-3 steps up, then a 45 degree cut inside.'],
['hitch','Hitch / Stop',6,D=>[[0,D],[0,D-1.5]],'Stem up, stop and turn to the QB.'],
['curl','Curl',12,D=>[[0,D],[-1.5,D-2.5]],'Stem, then curl back inside.'],
['comeback','Comeback',14,D=>[[0,D],[2,D-3.5]],'Stem deep, return toward the sideline.'],
['out','Out',10,D=>[[0,D],[12,D]],'Stem, then a flat cut to the sideline.'],
['dig','Dig / In',12,D=>[[0,D],[-15,D]],'Stem, then a flat cut across the middle.'],
['post','Post',12,D=>[[0,D],[-10,D+10]],'Stem, then 45 degrees to the goal post.'],
['corner','Corner / Flag',12,D=>[[0,D],[10,D+10]],'Stem, then 45 degrees to the pylon.'],
['postcorner','Post-Corner',10,D=>[[0,D],[-3,D+3],[5,D+14]],'Fake post, break to the corner.'],
['cornerpost','Corner-Post',8,D=>[[0,D],[4,D+4],[-2,D+16]],'Fake corner, break to the post.'],
['outup','Out-and-Up',8,D=>[[0,D],[3,D],[3,D+16]],'Sell the out, then go vertical.'],
['sluggo','Slant-and-Go / Sluggo',20,D=>[[0,1.5],[-3,4.5],[-3,D]],'Sell the slant, then go vertical.'],
['hitchgo','Hitch-and-Go',20,D=>[[0,6],[0,4],[1,D]],'Sell the hitch, then go vertical.'],
['seam','Seam',20,D=>[[-1,D]],'Vertical up the hash, splitting the safeties.'],
['drag','Drag / Shallow Cross',2.5,D=>[[0,2],[-18,D]],'Shallow crosser at 2-4 yards.'],
['over','Over / Deep Cross',15,D=>[[-3,5],[-22,D]],'Deep crosser behind the linebackers.'],
['whip','Whip / Pivot',3,D=>[[0,D],[-1,D+.5],[5,D-.5]],'Sell inside, pivot back out.'],
['stick','Stick',6,D=>[[0,D],[-2,D-.5]],'Stem to 6 yards, sit down inside.'],
['sail','Sail',12,D=>[[0,D],[8,D+3]],'Out-breaking deep route.'],
['flat','Flat',1,D=>[[7,D]],'Release to the flat, 1-3 yards.'],
['swing','Swing',0,D=>[[3,-1.5],[9,0]],'RB arcs outside behind the line.'],
['wheel','Wheel',25,D=>[[4,-.5],[9,2],[10,12],[10,D]],'RB or slot swings out, then up the sideline.'],
['angle','Angle',4,D=>[[1,D],[-2,D+2],[3,D+6]],'RB sells a block, cuts inside and back out.'],
['texas','Texas',5,D=>[[4,.5],[-1,D]],'RB to the flat, breaks back inside at 5-6.'],
['screen','Screen',0,D=>[[3,-1.5],[6,-1.5]],'Behind the line while linemen block ahead.'],
['check','Check-Release',2,D=>[[0,-.5],[5,.5]],'RB checks a rusher, then releases to the flat.'],
['block','Pass Block',0,D=>[[0,.8]],'Short set / block.']
];
const RT = {}; ROUTES.forEach(r => RT[r[0]] = r);

/* ---------- formations, fronts, coverage ---------- */
const OLX = [140,160,180,200,220];
const FORMS = {
  'I-Form':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,328],['FB',180,352],['RB',180,376],['TE',240,LINE],['X',30,LINE],['Z',330,322]],
  'Spread 2x2':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,350],['RB',202,350],['X',30,LINE],['H',100,322],['S',260,322],['Z',330,LINE]],
  'Trips Right':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,350],['RB',156,350],['X',30,LINE],['H',250,322],['S',290,322],['Z',330,LINE]],
  'Pro Set':[['LT',140,LINE],['LG',160,LINE],['C',180,LINE],['RG',200,LINE],['RT',220,LINE],['QB',180,328],['RB',148,364],['FB',212,364],['TE',240,LINE],['X',30,LINE],['Z',330,322]]
};
const PERS = [10,11,12,13,21,22];
const roleOf = l => /^(LT|LG|C|RG|RT|OL)$/.test(l) ? 'OL' : l === 'QB' ? 'QB' : /^(RB|FB)$/.test(l) ? 'RB' : /^(TE|Y)$/.test(l) ? 'TE' : 'WR';
const roleColor = r => r === 'OL' ? '#e9e6dc' : r === 'QB' ? '#f2c94c' : r === 'RB' ? '#f2994a' : r === 'TE' ? '#6fcf97' : '#56ccf2';
const mk = (l, x, y, role) => ({id:uid(), label:l, role:role || roleOf(l), x:x, y:y, route:null});
const dmk = (l, x, y) => ({id:uid(), label:l, x:x, y:y, zone:'none', zoneColor:'', isBlitz:false, gap:'A-Gap'});
function buildForm(name){ return FORMS[name].map(a => mk(a[0], a[1], a[2])); }
function pers(n){
  const rb = Math.floor(n / 10), te = n % 10, wr = 5 - rb - te, o = [];
  OLX.forEach((x, i) => o.push(mk(['LT','LG','C','RG','RT'][i], x, LINE)));
  o.push(mk('QB', 180, 345));
  [['RB',158,350],['FB',202,350]].slice(0, rb).forEach(a => o.push(mk(a[0], a[1], a[2])));
  [['Y',240,LINE],['F',120,LINE],['H',262,324]].slice(0, te).forEach(a => o.push(mk(a[0], a[1], a[2], 'TE')));
  [['X',30,LINE],['Z',330,324],['S',280,324],['S',90,324]].slice(0, wr).forEach(a => o.push(mk(a[0], a[1], a[2], 'WR')));
  return o;

}

/* ---------- play images ---------- */
function bboxOf(m, tight){
  let x0 = 0, y0 = 0, x1 = 360, y1 = 480;
  if (tight){ x0 = y0 = 1e9; x1 = y1 = -1e9; }
  const add = q => { x0 = Math.min(x0, q.x - 24); x1 = Math.max(x1, q.x + 24); y0 = Math.min(y0, q.y - 24); y1 = Math.max(y1, q.y + 24); };
  (m.players || []).forEach(p => { add(p); if (p.route) p.route.pts.forEach(add); });
  (m.defense || []).forEach(add); (m.lines || []).forEach(l => l.pts.forEach(add));
  if (tight){ if (x1 < x0){ x0 = 0; y0 = 0; x1 = 360; y1 = 480; } else { y1 += 14; const w = x1 - x0; if (w < 260){ const d = (260 - w) / 2; x0 -= d; x1 += d; } } }
  return {x0:x0, y0:y0, w:x1 - x0, h:y1 - y0};
}
function playSVG(m, sc, tight){
  const bb = bboxOf(m, tight), w = Math.round(bb.w * sc), h = Math.round(bb.h * sc);
  const inner = fieldInner(m, {thumb:true, exp:true}).split('var(--board)').join('#274d3d');
  return {svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + r1(bb.x0) + ' ' + r1(bb.y0) + ' ' + r1(bb.w) + ' ' + r1(bb.h) + '" width="' + w + '" height="' + h + '">' + inner + '</svg>', w:w, h:h};
}
function noteLines(ctx, text, maxW){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(par => {
    if (!par.trim()){ out.push(''); return; }
    let line = ''; par.split(/\s+/).forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; });
    if (line) out.push(line);
  });
  return out;
}
function renderPlayCanvas(m, header, notes, tight){
  return new Promise((resolve, reject) => {
    const bb = bboxOf(m, tight), o = playSVG(m, Math.min(2.6, 1000 / bb.w), tight), hdr = header === false ? 0 : 64, img = new Image();
    img.onload = () => {
      const PAD = 20, FB = 18, LH = 25, FT = 16;
      const secs = notes ? (m.secs || []).filter(q => q.text && q.text.trim()) : [];
      const mc = document.createElement('canvas').getContext('2d'); mc.font = FB + 'px system-ui,sans-serif';
      const blocks = secs.map(q => ({title:q.title || 'Note', lines:noteLines(mc, q.text, o.w - PAD * 2)}));
      const nh = blocks.length ? PAD + blocks.reduce((t, q) => t + FT + 10 + q.lines.length * LH + 14, 0) : 0;
      const c = document.createElement('canvas'); c.width = o.w; c.height = o.h + hdr + nh; const x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
      if (hdr){
        let fs = 30; x.font = 'bold ' + fs + 'px system-ui,sans-serif'; while (x.measureText(m.name).width > c.width - 40 && fs > 14){ fs -= 2; x.font = 'bold ' + fs + 'px system-ui,sans-serif'; }
        x.fillStyle = '#16241d'; x.fillText(m.name, 20, 38); x.fillStyle = '#5d6e64'; x.font = '16px system-ui,sans-serif'; x.fillText(m.folder + (m.form ? '  ·  ' + m.form : ''), 20, 58);
      }
      x.drawImage(img, 0, hdr, o.w, o.h);
      if (blocks.length){
        let y = o.h + hdr + PAD; x.fillStyle = '#d5ddd8'; x.fillRect(PAD, o.h + hdr + 6, o.w - PAD * 2, 2);
        blocks.forEach(q => {
          x.fillStyle = '#16241d'; x.font = 'bold ' + FT + 'px system-ui,sans-serif'; y += FT; x.fillText(q.title, PAD, y); y += 10;
          x.fillStyle = '#374151'; x.font = FB + 'px system-ui,sans-serif'; q.lines.forEach(l => { y += LH; x.fillText(l, PAD, y - 6); }); y += 14;
        });

  });
}

function tw(str, size){ let w = 0; for (const ch of String(str)) w += NARROW.indexOf(ch) > -1 ? .27 : WIDE.indexOf(ch) > -1 ? .83 : (ch >= 'A' && ch <= 'Z') ? .68 : (ch >= '0' && ch <= '9') ? .556 : ch === ' ' ? .278 : .52; return w * size; }
function pdfStr(t){
  return String(t == null ? '' : t).replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...').replace(/\u2022/g, '-').replace(/\t/g, ' ').replace(/[^\x20-\x7e\xa0-\xff]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
const pdfText = (x, y, size, font, str, gray) => 'BT /' + font + ' ' + size + ' Tf ' + (gray != null ? gray + ' g ' : '0 g ') + r1(x) + ' ' + r1(y) + ' Td (' + pdfStr(str) + ') Tj ET\n';
function wrapText(text, size, maxW){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(par => {
    if (!par.trim()){ out.push(''); return; }
    let line = '';
    par.split(/\s+/).forEach(w => { const t = line ? line + ' ' + w : w; if (tw(t, size) > maxW && line){ out.push(line); line = w; } else line = t; });
    if (line) out.push(line);
  });
  return out;
}
function buildPDF(pages){
  const objs = [], add = chunks => { objs.push(chunks); return objs.length; };
  const cat = add(null), pagesObj = add(null);
  const f1 = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
  const f2 = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>']);
  const kids = [];
  pages.forEach(pg => {
    let imgN = 0;
    if (pg.img) imgN = add(['<< /Type /XObject /Subtype /Image /Width ' + pg.img.w + ' /Height ' + pg.img.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + pg.img.bytes.length + ' >>\nstream\n', pg.img.bytes, '\nendstream']);
    const cont = add(['<< /Length ' + pg.ops.length + ' >>\nstream\n' + pg.ops + '\nendstream']);
    kids.push(add(['<< /Type /Page /Parent ' + pagesObj + ' 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R >>' + (imgN ? ' /XObject << /Im0 ' + imgN + ' 0 R >>' : '') + ' >> /Contents ' + cont + ' 0 R >>']));
  });
  objs[cat - 1] = ['<< /Type /Catalog /Pages ' + pagesObj + ' 0 R >>'];
  objs[pagesObj - 1] = ['<< /Type /Pages /Kids [' + kids.map(k => k + ' 0 R').join(' ') + '] /Count ' + kids.length + ' >>'];
  const chunks = []; let len = 0; const offs = [];
  const put = x => { let b; if (typeof x === 'string'){ b = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) b[i] = x.charCodeAt(i) & 255; } else b = x; chunks.push(b); len += b.length; };
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  objs.forEach((c, i) => { offs[i] = len; put((i + 1) + ' 0 obj\n'); c.forEach(put); put('\nendobj\n'); });
  const xr = len; let x = 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offs.forEach(o => { x += String(o).padStart(10, '0') + ' 00000 n \n'; });
  put(x + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + cat + ' 0 R >>\nstartxref\n' + xr + '\n%%EOF\n');
  const out = new Uint8Array(len); let pos = 0; chunks.forEach(b => { out.set(b, pos); pos += b.length; });
  return out;
}
async function getPlayJpeg(pl){
  const c = await renderPlayCanvas(pl, false), url = c.toDataURL('image/jpeg', .9), bin = atob(url.split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return {bytes:bytes, w:c.width, h:c.height};
}
async function folderPdfBytes(folder, getImg){
  const set = descendants(folder), plays = db.plays.filter(p => set.indexOf(p.folder) > -1);
  const pages = []; const M = 44, W = 612, maxW = W - 2 * M;
  const date = new Date().toISOString().slice(0, 10);
  let cover = pdfText(M, 716, 28, 'F2', folder) + pdfText(M, 694, 12, 'F1', 'ChalkboardPro playbook  -  ' + plays.length + ' play' + (plays.length === 1 ? '' : 's') + '  -  ' + date, .4);
  let y = 660; cover += pdfText(M, y, 13, 'F2', 'Contents'); y -= 20;
  plays.slice(0, 40).forEach((p, i) => { cover += pdfText(M, y, 11, 'F1', (i + 1) + '.  ' + p.name + '   (' + p.folder + ')'); y -= 16; });
  pages.push({ops:cover, img:null, kind:'cover'});
  for (const pl of plays){
    let img = null; try{ img = await getImg(pl); }catch(e){ img = null; }
    let ops = pdfText(M, 744, 20, 'F2', pl.name.length > 60 ? pl.name.slice(0, 57) + '...' : pl.name) + pdfText(M, 728, 10, 'F1', pl.folder + (pl.form ? '  -  ' + pl.form : ''), .4);
    let top = 716, ny = top;
    if (img){ const sc = Math.min(maxW / img.w, 400 / img.h), sw = img.w * sc, sh = img.h * sc; ops += 'q ' + r1(sw) + ' 0 0 ' + r1(sh) + ' ' + r1(M + (maxW - sw) / 2) + ' ' + r1(top - sh) + ' cm /Im0 Do Q\n'; ny = top - sh - 22; }
    let cur = {ops:ops, img:img, kind:'play'}; pages.push(cur);
    (pl.secs || []).forEach(sec => {
      if (!sec.text || !sec.text.trim()) return;
      const lines = wrapText(sec.text, 10.5, maxW);
      if (ny < 80){ cur = {ops:pdfText(M, 744, 14, 'F2', pl.name + ' (continued)'), img:null, kind:'cont'}; pages.push(cur); ny = 716; }
      cur.ops += pdfText(M, ny, 12, 'F2', sec.title || 'Notes'); ny -= 16;
      lines.forEach(l => { if (ny < 54){ cur = {ops:pdfText(M, 744, 14, 'F2', pl.name + ' (continued)'), img:null, kind:'cont'}; pages.push(cur); ny = 716; } cur.ops += pdfText(M, ny, 10.5, 'F1', l); ny -= 13.5; });
      ny -= 8;
    });
  }
  pages.forEach((pg, i) => { pg.ops += pdfText(M, 26, 8, 'F1', 'ChalkboardPro  -  ' + folder + '  -  page ' + (i + 1) + ' of ' + pages.length + '  -  view only', .5); });
  return buildPDF(pages);
}
async function sharePdf(folder){
  if (!folder) return;
  if (!db.plays.some(p => descendants(folder).indexOf(p.folder) > -1)){ toast('No plays in this folder yet'); return; }
  toast('Building PDF…');
  try{ const bytes = await folderPdfBytes(folder, getPlayJpeg); await saveFile(safeName(folder) + '.pdf', bytes); }
  catch(e){ toast('Could not build the PDF'); }
}

function canon(x){
  if (Array.isArray(x)) return '[' + x.map(canon).join(',') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).sort().filter(k => x[k] !== undefined && k !== 'by' && k !== 'updatedAt').map(k => JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}';
  return JSON.stringify(x);
}
const strip = o => { const c = clone(o); delete c.localOnly; delete c.by; delete c.updatedAt; return c; };
const COLS = {
  plays:{get:() => db.plays, norm:x => normPlay(x), skip:x => !!x.localOnly},
  plans:{get:() => db.plans, norm:x => { x.items = x.items || []; x.name = x.name || ''; x.opp = x.opp || ''; x.notes = x.notes || ''; return x; }, skip:() => false}
};
function applyCol(name, snap){
  const C = COLS[name], seen = {}, changed = [], arr = C.get();
  snap.docs.forEach(doc => {
    const id = doc.id, key = name + '/' + id; seen[id] = 1;
    if (cloud.deleted[key]) return;
    const rp = C.norm(Object.assign(clone(doc.data()), {id:id})), rsig = canon(strip(rp)), i = arr.findIndex(x => x.id === id);
    if (i < 0){ arr.push(rp); cloud.sent[key] = rsig; changed.push(id); return; }
    const lsig = canon(strip(arr[i]));
    if (lsig === rsig){ cloud.sent[key] = rsig; return; }
    if (cloud.sent[key] === lsig){ arr[i] = rp; cloud.sent[key] = rsig; changed.push(id); }
  });
  Object.keys(cloud.deleted).forEach(k => { if (k.indexOf(name + '/') === 0 && !seen[k.slice(name.length + 1)]) delete cloud.deleted[k]; });
  const prev = cloud.ids[name] || {};
  Object.keys(prev).forEach(id => { if (!seen[id]){ const i = arr.findIndex(x => x.id === id); if (i > -1){ arr.splice(i, 1); changed.push(id); } delete cloud.sent[name + '/' + id]; } });
  cloud.ids[name] = seen;
  return changed;
}
async function pushCol(name){
  const C = COLS[name], d = cloud.db, arr = C.get();
  for (const x of arr.slice()){
    if (C.skip(x)) continue;
    const o = strip(x), sig = canon(o), key = name + '/' + x.id;
    if (cloud.sent[key] === sig) continue;
    cloud.sent[key] = sig; delete cloud.deleted[key];
    try{ await d.collection(name).doc(x.id).set(Object.assign(o, {by:cloud.uid || null})); }catch(e){ delete cloud.sent[key]; throw e; }
  }
  const prev = cloud.ids[name] || {};
  for (const id of Object.keys(prev)){
    if (!arr.some(x => x.id === id)){ const key = name + '/' + id; cloud.deleted[key] = true; delete prev[id]; delete cloud.sent[key]; await d.collection(name).doc(id).delete(); }
  }
}
async function pushMeta(){
  const meta = {folders:db.folders, routes:db.routes, formations:db.formations, dict:db.dict}, sg = canon(meta);
  if (cloud.metaSent === sg) return;
  cloud.metaSent = sg;
  try{ await cloud.db.doc('team/meta').set(Object.assign(clone(meta), {by:cloud.uid || null})); }catch(e){ cloud.metaSent = null; throw e; }

function applyMeta(s0){
  if (cloud.disabled) return;
  if (!s0.exists){ if (cloud.metaSent === undefined) cloud.metaSent = null; return; }
  const m = s0.data() || {}, remote = {folders:m.folders || [], routes:m.routes || [], formations:m.formations || [], dict:m.dict || []};
  const local = {folders:db.folders, routes:db.routes, formations:db.formations, dict:db.dict}, rs = canon(remote), ls = canon(local);
  if (rs === ls){ cloud.metaSent = rs; return; }
  if (cloud.metaSent === ls){ db.folders = remote.folders.length ? remote.folders : db.folders; db.routes = remote.routes; db.formations = remote.formations; db.dict = remote.dict; cloud.metaSent = canon({folders:db.folders, routes:db.routes, formations:db.formations, dict:db.dict}); save(); if (v.tab === 'book' || v.tab === 'learn') render(); return; }
  if (cloud.metaSent === undefined || cloud.metaSent === null){
    remote.folders.forEach(f => { if (!db.folders.some(x => x.name === f.name)) db.folders.push(f); });
    remote.routes.forEach(r => { if (!db.routes.some(x => x.id === r.id)) db.routes.push(r); });
    remote.formations.forEach(f => { if (!db.formations.some(x => x.id === f.id)) db.formations.push(f); });

function startSync(){

const enc = o => 'CBP2:' + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function dec(s){ s = s.trim(); if (/^CBP[12]:/.test(s)) s = decodeURIComponent(escape(atob(s.slice(5)))); return JSON.parse(s); }
function doImport(txt){
  let o; try{ o = dec(txt); }catch(e){ toast('That code is not valid'); return; }
  let np = 0, nl = 0;
  const addPlay = pl => { if (!pl || !Array.isArray(pl.players) || db.plays.some(x => x.id === pl.id)) return; db.plays.push(normPlay(pl)); np++; };
  if (o.t === 'play') addPlay(o.play);
  else if (o.t === 'plan' || o.t === 'all'){
    (o.plays || []).forEach(addPlay);
    (o.t === 'plan' ? [o.plan] : (o.plans || [])).forEach(pn => { if (!pn || !Array.isArray(pn.items)) return; if (db.plans.some(x => x.id === pn.id)) pn.id = uid(); db.plans.push(pn); nl++; });
    (o.folders || []).forEach(f => { if (f && f.name && !db.folders.some(x => x.name === f.name)) db.folders.push({name:f.name, parent:f.parent || null}); });
    (o.routes || []).forEach(r => { if (r && r.id && !db.routes.some(x => x.id === r.id)) db.routes.push(r); });
    (o.formations || []).forEach(f => { if (f && f.id && !db.formations.some(x => x.id === f.id)) db.formations.push(f); });
  } else { toast('That code is not valid'); return; }
  db = normDb(db); save(); toast('Imported ' + np + ' play' + (np === 1 ? '' : 's') + ', ' + nl + ' plan' + (nl === 1 ? '' : 's')); render();
}

function callSheet(pl){
  const plays = pl.items.map(id => db.plays.find(p => p.id === id)).filter(Boolean);
  let t = (pl.name || 'Game plan') + (pl.opp ? ' vs ' + pl.opp : '') + '\n'; if (pl.notes) t += pl.notes + '\n'; t += '\n';

    case 'sSit': { const m = SIT[t.value]; if (m){ pushHist(); ed.sit = t.value; ed.spot = m[0]; ed.dist = m[1]; $('#sSpot').value = m[0]; $('#sDist').value = m[1]; syncEditor(); } break; }
    case 'sSpot': pushHist(); ed.spot = Math.max(1, Math.min(99, +t.value || 20)); t.value = ed.spot; ed.dist = Math.min(ed.dist, 100 - ed.spot) || 1; $('#sDist').value = ed.dist; syncEditor(); break;
    case 'sDist': pushHist(); ed.dist = Math.max(1, Math.min(30, +t.value || 10)); t.value = ed.dist; syncEditor(); break;
    case 'fieldPick': S.fieldColor = t.value; save(); draw(); break;
    case 'sSpot': pushHist(); ed.spot = Math.max(1, Math.min(99, +t.value || 20)); t.value = ed.spot; syncEditor(); break;
    case 'fieldMarks': S.marks = t.checked; save(); syncEditor(); break;
    case 'fieldDepth': S.showDepth = t.checked; save(); syncEditor(); break;
    case 'dmZone': { const d = ed.rm && ed.defense.find(x => x.id === ed.rm.id); if (d){ pushHist(); d.zone = t.value; d.zoneColor = ZONE_COL[t.value]; if (t.value !== 'none') d.isBlitz = false; renderInspector(); syncEditor(); openDefMenu(d); } break; }
    case 'rmMore': if (t.value){ const q = rmPlayer(); if (q){ ed.sel = {side:'o', id:q.id}; stamp(t.value); const q2 = selObj(); if (q2 && q2.route) openRouteMenu(q2, q2.route.pts.length - 1); } } break;
    case 'fieldYards': S.yards = t.checked; save(); draw(); break;
    case 'sLevel': setLevel(t.value); break;
    case 'penPick': ed.pen = t.value; S.pen = t.value; save(); syncEditor(); break;
    case 'penDash': ed.dash = t.checked; S.dash = t.checked; save(); break;
    case 'insNote': if (o){ pushHist(); const had = !!o.note; o.note = t.value.trim(); if (had !== !!o.note) renderInspector(); syncEditor(); } break;
    case 'setImgNotes': S.imgNotes = t.checked; save(); break;
    case 'setImgHdr': S.imgHeader = t.checked; save(); break;
    case 'setImgTgt': S.imgTight = t.checked; save(); break;
    case 'dnsSize': case 'dnsBw': case 'dnsBs': case 'dnsAlign': case 'dnsColor': case 'dnsFill': case 'dnsBc': case 'dnsFillOn': {
      const k = {dnsSize:'size', dnsBw:'bw', dnsBs:'bstyle', dnsAlign:'align', dnsColor:'color', dnsFill:'fill', dnsBc:'bcolor', dnsFillOn:'fill'}[id]; let val = t.value;
      if (k === 'size' || k === 'bw') val = +val;
      if (id === 'dnsFillOn') val = t.checked ? ($('#dnsFill').value || '#ffffff') : '';
      S.noteStyle = Object.assign({}, S.noteStyle || {}); S.noteStyle[k] = val;
      if (id === 'dnsFill'){ const c = $('#dnsFillOn'); if (c) c.checked = true; }
      save(); try{ draw(); }catch(_){} break; }
    case 'nsSize': case 'nsBw': case 'nsBs': case 'nsAlign': case 'nsColor': case 'nsFill': case 'nsBc': case 'nsFillOn':
      if (o){ pushHist(); const k = {nsSize:'size', nsBw:'bw', nsBs:'bstyle', nsAlign:'align', nsColor:'color', nsFill:'fill', nsBc:'bcolor', nsFillOn:'fill'}[id]; let val = t.value;
        if (k === 'size' || k === 'bw') val = +val;
        if (id === 'nsFillOn') val = t.checked ? ($('#nsFill').value || '#ffffff') : '';
        o.noteStyle = Object.assign({}, o.noteStyle || {}); o.noteStyle[k] = val;
        if (id === 'nsFill'){ o.noteStyle.fill = t.value; const c = $('#nsFillOn'); if (c) c.checked = true; }
        syncEditor(); } break;
    case 'insLabel': if (o){ pushHist(); o.label = t.value.trim() || 'P'; renderInspector(); syncEditor(); } break;
    case 'insShape': if (o){ pushHist(); o.shape = t.value; syncEditor(); } break;
    case 'insColor': if (o){ pushHist(); o.color = t.value; syncEditor(); } break;
    case 'insRColor': if (o && ed.sel.side === 'o'){ pushHist(); ensureRoute(o).color = t.value; syncEditor(); } break;
    case 'insDefault': if (o && t.checked){ const k = ed.sel.side === 'o' ? 'off' : 'def'; S[k].shape = shapeOf(o, ed.sel.side); S[k].color = colorOf(o, ed.sel.side); save(); toast('Saved as the default style'); } break;
    case 'insZone': if (o){ pushHist(); o.zone = t.value; o.zoneColor = ZONE_COL[t.value]; if (t.value !== 'none') o.isBlitz = false; renderInspector(); syncEditor(); } break;
    case 'insZoneColor': if (o){ pushHist(); o.zoneColor = t.value; syncEditor(); } break;
    case 'insBlitz': if (o){ pushHist(); o.isBlitz = t.checked; if (t.checked){ o.zone = 'none'; o.zoneColor = ZONE_COL.none; } renderInspector(); syncEditor(); } break;
    case 'insGap': if (o){ pushHist(); o.gap = t.value; syncEditor(); } break;
    case 'setOffName': S.off.name = t.value.trim() || 'WR'; save(); break;
    case 'setOffShape': S.off.shape = t.value; save(); break;
    case 'setOffOn': S.off.color = t.checked ? $('#setOffColor').value : ''; save(); break;
    case 'setOffColor': if ($('#setOffOn').checked){ S.off.color = t.value; save(); } break;
    case 'setDefName': S.def.name = t.value.trim() || 'LB'; save(); break;
    case 'setDefShape': S.def.shape = t.value; save(); break;
    case 'setDefColor': S.def.color = t.value; save(); break;
    case 'setSnap': S.snap = t.checked; save(); break;
    case 'setField': S.fieldColor = t.value; save(); break;
    case 'setYards': S.yards = t.checked; save(); break;
    case 'setLevel': S.level = t.value; save(); break;
    case 'setTheme': S.theme = t.value; save(); applyTheme(); break;
  }
});

if (typeof window !== 'undefined' && window.__CBP_TEST) window.__CBP_TEST.api = {sync:syncPush, run:runCommand, ed:() => ed, cloud:cloud, askAI:askAI, v:v, buildPDF:buildPDF, folderPdfBytes:folderPdfBytes, wrapText:wrapText, db:() => db};
applyTheme();
save();
render();
initCloud();
})();
</script>
</body>
</html>
